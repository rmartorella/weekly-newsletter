<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>The Signal</title><link rel="icon" type="image/png" sizes="180x180" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png"></head><body>
<style>
:root{
  --ink:#0B0838; --ink-2:#2A2748; --ink-3:#514D6E; --ink-4:#7B7794;
  --bg:#FFFFFF; --app-bg:#F3F5F9; --paper:#F7F9FC; --paper-2:#EDF1F7;
  --rule:#DEE3EC; --hair:#EBEFF6;
  --accent:#FA733C; --accent-soft:#FFEEE6; --accent-ink:#9E3F14;
  --blue-900:#0E3F6B; --blue-700:#1B6AAE; --blue:#4AA3E3; --blue-300:#95C9EE; --blue-100:#D4E8F8; --blue-50:#EDF5FC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F4F3F9; --ink-2:#D3D1E4; --ink-3:#A5A2BC; --ink-4:#7B7799;
    --bg:#12103F; --app-bg:#0B0838; --paper:#1A1650; --paper-2:#221D5C;
    --rule:#2E2A6B; --hair:#26215F;
    --accent:#FF8A57; --accent-soft:#3B1F14; --accent-ink:#FFC6AB;
    --blue-900:#B9DBF4; --blue-700:#7FBEEB; --blue:#5EB0E8;
    --blue-300:#3A79AE; --blue-100:#1D3F63; --blue-50:#152C46;
  }
}
*{box-sizing:border-box}
:root[data-theme="dark"]{--ink:#F4F3F9; --ink-2:#D3D1E4; --ink-3:#A5A2BC; --ink-4:#7B7799;--bg:#12103F; --app-bg:#0B0838; --paper:#1A1650; --paper-2:#221D5C;--rule:#2E2A6B; --hair:#26215F;--accent:#FF8A57; --accent-soft:#3B1F14; --accent-ink:#FFC6AB;--blue-900:#B9DBF4; --blue-700:#7FBEEB; --blue:#5EB0E8;--blue-300:#3A79AE; --blue-100:#1D3F63; --blue-50:#152C46}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--app-bg);color:var(--ink);
  font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.tnum{font-variant-numeric:tabular-nums}

.shell{max-width:1200px;margin:0 auto;padding:22px 26px 0;display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
@media(max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:0;padding:16px 18px 0}}
.shell>*{min-width:0}
main{min-width:0;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:30px 38px 40px;margin-bottom:26px}
@media(max-width:760px){main{padding:22px 20px 30px}}

.masthead{position:relative;border-bottom:2px solid var(--blue-900);padding-bottom:14px;margin-bottom:26px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.masthead .mh{font-family:"Newsreader",Georgia,serif;font-size:clamp(32px,4.6vw,46px);font-weight:500;color:var(--ink);letter-spacing:-.025em;line-height:1}
.masthead .dl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--ink-3);text-align:right;line-height:1.7;margin-top:44px}
.masthead .dl b{color:var(--accent);font-weight:700}
.masthead:after{content:"";position:absolute;left:0;bottom:-2px;width:96px;height:2px;background:var(--accent)}
@media(max-width:600px){.masthead .dl{margin-top:48px}}
.fbbtn{position:absolute;top:0;right:0;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:9px 16px;border-radius:6px;
  background:var(--accent);color:#fff;text-decoration:none;box-shadow:0 1px 2px rgba(11,8,56,.12)}
.fbbtn:hover{filter:brightness(.95)}
#feedback{scroll-margin-top:24px}

.toc{border:1px solid var(--rule);border-top:2px solid var(--blue-900);border-radius:7px;background:var(--paper);padding:15px 19px 13px}
.toc .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-bottom:9px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{border-top:1px solid var(--hair)}
.toc li:first-child{border-top:0}
.toc a{display:flex;gap:11px;align-items:baseline;padding:8px 0;text-decoration:none;color:inherit}
.toc .n{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:13px;color:var(--accent);flex:0 0 14px}
.toc .t{font-size:13.5px;font-weight:600;color:var(--ink);flex:0 0 auto}
.toc a:hover .t{color:var(--accent)}
.toc .d{font-family:"Newsreader",Georgia,serif;font-size:14.5px;line-height:1.35;color:var(--ink-3);min-width:0}
@media(max-width:640px){.toc a{flex-wrap:wrap}.toc .t{flex:1 1 0;min-width:0}.toc .d{flex:0 0 100%;padding-left:25px;margin-top:2px}}
#whats-new,#part-essay,.sect{scroll-margin-top:20px}

.news h3{font-family:"Newsreader",Georgia,serif;font-size:clamp(21px,2.7vw,27px);font-weight:500;color:var(--ink);letter-spacing:-.018em;line-height:1.2;max-width:30ch;margin-bottom:14px}
.news p{font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.58;color:var(--ink-2)}
.news p+p{margin-top:12px}
.news p b{color:var(--ink);font-weight:600}
.news p.sub2{margin-top:10px;padding-left:20px;border-left:2px solid var(--hair)}
.news a{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
.news a:hover{color:var(--accent)}
.newsblock+.newsblock{margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}

.part{margin-top:44px}
.parthead{display:flex;align-items:baseline;gap:13px;margin-bottom:16px}
.parthead .num{font-family:"Newsreader",Georgia,serif;font-size:13px;font-style:italic;color:var(--accent);flex:0 0 auto}
.parthead h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.parthead .line{flex:1;height:1px;background:var(--rule)}

.essay h3{font-family:"Newsreader",Georgia,serif;font-size:clamp(25px,3.4vw,34px);font-weight:500;color:var(--ink);letter-spacing:-.02em;line-height:1.18;max-width:22ch;margin-bottom:16px}
.essay p{font-family:"Newsreader",Georgia,serif;font-size:18.5px;line-height:1.6;color:var(--ink-2);max-width:none}
.essay p + p{margin-top:14px}
.essay em{font-style:italic;color:var(--ink)}
.sign{margin-top:20px;padding-top:12px;border-top:2px solid var(--accent);display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

.sect{margin-top:34px;padding-top:2px}
.secthead{display:flex;align-items:baseline;gap:12px;margin-bottom:11px;flex-wrap:wrap}
.secthead h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--blue-700);display:flex;align-items:center;gap:8px}
.secthead h3:before{content:"";width:9px;height:9px;background:var(--accent);border-radius:2px;flex:0 0 auto}
.secthead .r{flex:1;height:1px;background:var(--blue-700);opacity:.3;min-width:20px}
.analysis{font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.58;color:var(--ink-2);max-width:none}

.ex{margin-top:18px;border:1px solid var(--rule);border-top:2px solid var(--accent);border-radius:7px;background:var(--bg);overflow:hidden}
.exh{padding:13px 18px 12px;border-bottom:1px solid var(--hair);background:var(--paper);display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.exh h4{font-size:14.5px;font-weight:600;letter-spacing:-.008em}
.exh .unit{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--ink-4)}
.exb{padding:16px 18px 18px}
.freq{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.reads{margin-top:13px;font-size:13.5px;line-height:1.55;color:var(--ink-2);border-left:3px solid var(--blue-700);background:var(--blue-50);padding:11px 13px;border-radius:0 5px 5px 0}
.reads b{color:var(--ink);font-weight:600}
.sowhat{margin-top:11px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--accent-ink)}
.sowhat .lbl{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:6px}

.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:460px;height:auto}
.axl{font-size:9.5px;fill:var(--ink-4);font-weight:500;font-family:"Libre Franklin",sans-serif}
.gl{stroke:var(--hair);stroke-width:1}
.gz{stroke:var(--rule);stroke-width:1.4}
.endl{font-size:10.5px;font-weight:700;font-family:"Libre Franklin",sans-serif}

.rk{display:flex;flex-direction:column}
.rkrow{display:grid;grid-template-columns:1fr 46px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair)}
.rkrow:last-child{border-bottom:0}
.rkrow .lab{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:10px;min-width:0}
.rkrow .lab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkrow .bar{height:8px;border-radius:2px;flex:0 0 auto}
.rkrow .v{text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

.qs{display:flex;flex-direction:column;gap:11px}
.q{font-family:"Newsreader",Georgia,serif;font-size:15.5px;font-style:italic;line-height:1.5;color:var(--ink-2);padding:12px 15px;background:var(--blue-50);border-left:3px solid var(--blue-300);border-radius:0 5px 5px 0}
.q cite{display:block;font-family:"Libre Franklin",sans-serif;font-style:normal;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);margin-top:8px;font-weight:700}

.ask{border:1px solid var(--rule);border-radius:7px;padding:22px;background:var(--paper)}
.ask h4{font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:400;line-height:1.3;max-width:36ch;margin-bottom:8px}
.ask .sub{font-size:13.5px;color:var(--ink-3);line-height:1.55;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:15px}
.opt{text-align:left;border:1px solid var(--rule);border-radius:4px;padding:11px 14px;font-size:13.5px;color:var(--ink-2);transition:.14s}
.opt:hover{border-color:var(--blue-700);background:var(--blue-50)}
.opt.on{border-color:var(--blue-700);background:var(--blue-50);color:var(--blue-900);font-weight:600}
.thanks{margin-top:11px;font-size:12.5px;color:var(--blue-700);font-weight:600}
.thanks.err{color:var(--accent-ink)}
.namerow{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:0 0 20px}
.namerow label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.namerow .thanks{margin-top:0}
.submitbar{margin-top:24px;padding:19px 21px;border:1px solid var(--accent);border-left:3px solid var(--accent);border-radius:7px;
  background:var(--accent-soft);display:flex;align-items:center;gap:17px;flex-wrap:wrap}
.submitbar .cta{margin-top:0;padding:13px 30px;font-size:14.5px;box-shadow:0 1px 3px rgba(11,8,56,.18);flex:0 0 auto}
.submitbar .thanks{margin-top:0}
.subnote{font-size:12.5px;line-height:1.5;color:var(--accent-ink);font-weight:600;min-width:0}
.fld{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;width:100%;max-width:340px;flex:1 1 210px;min-width:0}
.fld::placeholder{color:var(--ink-4)}
.fld:focus{border-color:var(--blue-700);outline:none;box-shadow:0 0 0 3px var(--blue-50)}
textarea.fld{display:block;max-width:none;min-height:78px;resize:vertical;line-height:1.5;margin-top:15px}
.cta[disabled]{opacity:.55;cursor:default}
.ask.partner{margin-top:16px;border-color:var(--accent);border-left:3px solid var(--accent);background:var(--accent-soft)}
.ask.partner h4{color:var(--accent-ink)}
.ask.partner .sub{color:var(--accent-ink);opacity:.92}
.cta{margin-top:14px;background:var(--accent);color:#fff;border-radius:5px;padding:10px 18px;font-size:13.5px;font-weight:600}
.cta:hover{filter:brightness(1.06)}

footer{border-top:1px solid var(--rule);margin-top:44px;padding-top:20px;font-size:12px;color:var(--ink-3);line-height:1.65;max-width:none}
footer b{color:var(--ink-2);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.fade{animation:fi .28s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- rail (archive) ---------- */
.rail{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;
  background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:18px 16px 16px}
@media(max-width:960px){.rail{position:static;max-height:none;overflow:visible;margin-bottom:16px}}
.railtitle{font-family:"Newsreader",Georgia,serif;font-size:23px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin-bottom:3px;color:var(--ink)}
.railsub{font-size:11px;color:var(--ink-3);line-height:1.45;margin-bottom:18px}
.railhead{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);
  padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.issues{display:flex;flex-direction:column}
@media(max-width:960px){.issues{flex-direction:row;gap:9px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}.railtitle{font-size:30px}}
.iss{text-align:left;padding:12px 12px 12px 13px;border-left:2px solid transparent;border-radius:0 6px 6px 0;
  display:flex;flex-direction:column;gap:3px;transition:background .15s,border-color .15s}
.iss:hover{background:var(--paper)}
.iss .n{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-4)}
.iss .d{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.iss .t{font-family:"Newsreader",Georgia,serif;font-size:13px;font-style:italic;color:var(--ink-3);line-height:1.35}
.iss[aria-current="true"]{border-left-color:var(--accent);background:var(--blue-50)}
.iss[aria-current="true"] .n{color:var(--accent-ink)}
.iss[aria-current="true"] .d{color:var(--ink)}
@media(max-width:960px){.iss{flex:0 0 200px;border-left:0;border-top:2px solid transparent;border-radius:0 0 6px 6px;background:var(--paper)}.iss[aria-current="true"]{border-top-color:var(--accent)}}
.raillegend{margin-top:24px;padding-top:16px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--ink-4);line-height:1.5}
@media(max-width:960px){.raillegend{display:none}}

/* ---------- pager ---------- */
.pager{margin-top:48px;padding-top:18px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:14px}
.pg{font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;text-align:left}
.pg:hover{color:var(--blue-700)}
.pg .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-4)}
.pg.n{text-align:right;align-items:flex-end}

/* ---------- new exhibit types ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.strow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.strow .lab{font-size:12px;font-weight:600;color:var(--ink-2)}
.stbar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--paper-2)}
.stbar i{font-style:normal;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

table.mom{width:100%;border-collapse:collapse;font-size:13px}
table.mom th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);font-weight:700;text-align:right;padding:0 8px 8px;border-bottom:1px solid var(--rule)}
table.mom th:first-child,table.mom td:first-child{text-align:left;padding-left:0}
table.mom td{padding:9px 8px;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
table.mom tr:last-child td{border-bottom:0}
table.mom td.name{font-weight:600;color:var(--ink)}
table.mom td.who{font-size:11.5px;color:var(--ink-3);text-align:left}
.up{color:var(--accent);font-weight:700}.dn{color:var(--blue-700);font-weight:700}.fl{color:var(--ink-4)}
.momwrap{overflow-x:auto}
table.mom{min-width:680px}
table.mom th{white-space:nowrap}
table.mom td:not(.name):not(.who){white-space:nowrap}
table.mom td.name{min-width:190px}
table.mom td.who{min-width:150px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.two h5{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}

.stages{display:flex;flex-direction:column;gap:22px}
.stg .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.stg .hd b{font-size:13.5px;color:var(--ink)}
.stg .hd span{font-size:12px;color:var(--ink-3)}
.stg .hd span b{font-size:15px;color:var(--accent)}
.track{display:flex;height:34px;border-radius:5px;overflow:hidden;background:var(--paper-2);position:relative}
.track i{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.15;color:#fff;font-weight:700;border-right:1px solid rgba(255,255,255,.35);overflow:hidden;white-space:nowrap}
.track i small{font-weight:500;opacity:.9;font-size:9px}
.track .rest{color:var(--ink-3);background:repeating-linear-gradient(135deg,var(--paper-2) 0 6px,var(--hair) 6px 12px);border-right:0}
.stgnote{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-style:italic}
.stgnote b{font-style:normal;color:var(--accent-ink)}
.stgkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--ink-3)}
.stgkey span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.dot3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){.dot3{grid-template-columns:1fr}}
.dbox{border:1px solid var(--rule);border-radius:6px;padding:14px 15px;background:var(--paper)}
.dbox h5{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:10px}
.drow{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;color:var(--ink-2)}
.drow .bar{height:7px;border-radius:2px;background:var(--blue-300)}
.drow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.drow.hot .bar{background:var(--accent)}.drow.hot .v{color:var(--accent)}

.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center}
@media(max-width:560px){.frow{grid-template-columns:110px 1fr 60px}}
.frow .lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.frow .fb{height:22px;border-radius:3px;background:var(--blue-300)}
.frow.hot .fb{background:var(--accent)}

  essay:{
    h:'Win it in the conversation, then write it down fast.',
    ps:[
      'Most of us were trained to think the proposal is where we win the work. This week we went through two years of invitation-only briefs where we brought one consultant to a client, and I think we&rsquo;ve had it backwards. Of the ones that got as far as the consultant submitting a proposal, three in four turned into work. That&rsquo;s not a win rate for every invitation, since some stall before a proposal is ever written, but it tells you a lot about what happens once you get there. The ones that won were nearly 40% shorter than the ones that didn&rsquo;t, they started sooner, and they leaned less on frameworks and phases. And they came in fast. Every few days a proposal takes, the win rate drops: proposals submitted within two days turned into work 83.0% of the time, falling to 74.8% at two to five days and 71.0% at five to ten, and it keeps falling from there.',
      'Part of the reason is simple: a deal that&rsquo;s going cold produces slow proposals, and most of the ones that didn&rsquo;t convert weren&rsquo;t turned down, the project just stalled. But I think the bigger reason is that by the time a winning proposal gets written, the selling is already done. It happened in the conversation, when the client heard their own problem played back to them along with a first step they could say yes to. The winning proposal writes that down. When a proposal runs long, it&rsquo;s often still trying to sell, and a client who&rsquo;s still being sold hasn&rsquo;t decided yet. So put your effort into the conversation, and when it&rsquo;s time to write, write it down fast. Below, you&rsquo;ll see what that looks like, and how an invitation-only brief gets from creation to signed contract in under nine days.'
    ]
  },
  sections:[
    { k:'Demand trends', id:'sec-demand',
      analysis:'This month we looked at the shape of the invited work clients are actually signing, using the winning proposals on new invitation-only engagements. More invited projects are being set up as ongoing engagements, with a monthly fee, a set number of days a week or a fractional role, and that structure has nearly tripled. AI now shows up in more than one winning proposal in five. More projects start within a week, though that one&rsquo;s moved less. And short projects are holding up, with about three in ten engagements still running four weeks or less.',
      blocks:[
        {type:'mom',title:'The shape of the invited work clients are signing',unit:'% of winning proposals on new invitation-only engagements, by period submitted',first:'In the winning proposal',cols:['2024 H2','2025 H2','2026 to date'],last:'What it signals',
         rows:[
           ['Set up as an ongoing engagement: monthly fee, set days per week or fractional',9.3,15.4,25.4,'Offer an ongoing option, tied to the outcome'],

           ['Runs four weeks or less',36.6,31.2,31.9,'Dipped, then held. Short work isn&rsquo;t going away']],
         reads:'<b>Read it as:</b> proposals that set the project up as an ongoing engagement, whether that&rsquo;s a monthly fee, a set number of days a week or a fractional role, went from 9.3% of invited wins to 25.4%. That reads as a change in how invited projects are paced and paid for, with the outcome still defining the work. AI shows up in 22.1% of winning proposals this year, up from 8.1%. Two in three winning proposals now start within a week of being submitted, up from 60.2%. Projects of four weeks or less dipped from 36.6% and have held at about 31% since. <b>One thing to know:</b> this covers winning proposals on new invitation-only engagements only, with extensions and internal accounts taken out, and proposals dated to start before they were submitted excluded from the start-date row. The pricing and AI rows are keyword matches on proposal text (for example &ldquo;per month,&rdquo; &ldquo;days per week,&rdquo; &ldquo;fractional,&rdquo; &ldquo;AI&rdquo;), so they undercount proposals that say the same thing differently. Treat the levels as a floor and the direction as solid.',
         sowhat:'If an ongoing structure suits the project, offer it in the proposal as an option next to the scoped version, and tie it to the outcome and the first deliverable, because it&rsquo;s the fastest-growing way clients are setting up invited work. If AI changes how you&rsquo;d do the job, say how in one or two concrete sentences, not a paragraph about AI in general. And keep your availability current, because two in three of these engagements start within a week.'}
      ]},
    { k:'Buyer decision trends', id:'sec-buyer',
      analysis:'You asked what winning proposals have in common. We looked at every invitation-only brief over the last two years where we brought one consultant to the client and asked for a proposal, and compared the ones that turned into work with the ones that didn&rsquo;t. One caveat up front: most of the ones that didn&rsquo;t convert weren&rsquo;t turned down by the client. The project stalled or was shelved. So this is as much about what a healthy deal looks like as what a good document looks like. Two patterns stand out. Winners come in fast: proposals that arrived within two days turned into work 83.0% of the time, against 53.2% at three weeks or more. And they&rsquo;re shorter and more concrete, nearly 40% shorter, with less leaning on frameworks, attachments and credentials. The reason is that on an invited brief the client has usually already chosen the consultant, so the proposal doesn&rsquo;t need to sell them again. What it needs to do is show you understood the project.',
      blocks:[
        {type:'dist',title:'Speed: how often a proposal turns into work, by how fast it came in',unit:'% of invitation-only, single-consultant proposals that became an engagement, by time from being brought in to submitting',
         rows:[['1 hour to 2 days',83.0,true],['2 to 5 days',74.8,false],['5 to 10 days',71.0,false],['10 to 21 days',68.6,false],['21 days or more',53.2,false]],
         reads:'<b>Read it as:</b> across invitation-only briefs that got as far as one consultant being asked for, and submitting, a proposal, 75.0% became engagements. This is a late-stage rate: opportunities that stalled before a proposal was submitted aren&rsquo;t counted. Proposals that came in within two days converted at 83.0%. The odds fall from there, and at three weeks or more it&rsquo;s close to a coin flip at 53.2%. <b>One thing to know:</b> of the proposals that didn&rsquo;t turn into work, very few were declined by the client. Almost all the rest sit on briefs that were shelved. So a slow proposal is partly a symptom of a deal that&rsquo;s cooling, not only a cause. We&rsquo;ve also taken out proposals submitted within an hour of the consultant being attached, since those are usually paperwork for a deal that was already agreed, along with extensions and internal accounts. Proposals submitted July 2024 through August 2026.',
         sowhat:'Treat the proposal as a 48-hour job. Leave the scoping conversation with what you need to write it: the outcome, the first deliverable, the start date and who signs. If you can&rsquo;t write it in two days, that&rsquo;s usually a sign something wasn&rsquo;t agreed in the room. Pick up the phone, with your Client Partner, and close that gap before the deal cools.'},
        {type:'cmp',title:'Content: what&rsquo;s in the proposals that win, and the ones that don&rsquo;t',unit:'Invitation-only, single-consultant proposals, won against not won',
         rows:[
           ['Median length of the approach section','149 words','239 words',149,239],
           ['Median proposed length of the engagement','8.4 weeks','10 weeks',8.4,10],
           ['Median days from proposal to start','6 days','10 days',6,10],
           ['Lays the work out in phases','27.5%','37.3%',27.5,37.3],
           ['Leans on frameworks, methodology or best practice','29.9%','37.3%',29.9,37.3],
           ['Comes with a separate attachment','31.1%','45.9%',31.1,45.9],
           ['Restates credentials: years of experience, my background','7.2%','11.4%',7.2,11.4]],
         reads:'<b>Read it as:</b> winning proposals are nearly 40% shorter, propose a shorter first engagement, and start sooner. They&rsquo;re less likely to lay out a multi-phase plan, lean on frameworks, attach a separate deck or restate the consultant&rsquo;s credentials. On an invited brief, the client has usually already chosen the person, so the proposal doesn&rsquo;t need to sell them again. What it does need is to show you heard them. One client choosing between two consultants put it this way: &ldquo;When I left the conversations [I] was leaning slightly toward [one consultant], then the proposals came back and I just sort of felt like [the other] sort of understood the conversation better.&rdquo; <b>One thing to know:</b> these are word counts and keyword matches on proposal text, and a short proposal is partly a sign the deal was already agreed. They tell you what winners tend to look like. They aren&rsquo;t a formula.',
         sowhat:'Write the proposal for someone who&rsquo;s already leaning yes. Open with their problem in their words, then the first thing they&rsquo;ll have in hand and when, then the price and the start date. Skip the framework slide and the bio, since they&rsquo;ve already met you. If you know the client is weighing you against someone else, add depth where it counts: show you understood that specific conversation, with an outline and timeline they can picture.'}
      ]},
    { k:'Supply trends', id:'sec-supply',
      analysis:'This was the other most requested topic: how an invitation-only brief actually gets filled. The short answer is that much of it happens before the brief exists. By the time a brief shows up on the platform, the client has often already met the consultant and agreed on the outline, so the brief is the paperwork, and the paperwork moves quickly: a median of 8.6 days from brief to signed contract. The step that decides who gets the work comes earlier, and it mostly comes down to who a Client Partner already knows can deliver. The track record backs that up: nearly half of invited wins went to a consultant who&rsquo;d already delivered for that same client, though more than one in five went to someone winning on Catalant for the first time.',
      blocks:[
        {type:'steps',title:'How an invitation-only brief gets filled, step by step',unit:'New invitation-only engagements, briefs created July 2025 to August 2026, median days from the brief being created',
         steps:[
           ['Before','Before the brief','A client mentions a need to their Client Partner, who thinks of someone, checks fit and makes the introduction. Only 17.8% of these wins had a client meeting booked through the platform, so most of this happens off it.',false],
           ['Day 0','Brief created, consultant attached','69.9% of winning consultants were attached within an hour of the brief being created, and on 64.9% of these wins they were the only consultant on it. Usually, the choice was made before the brief was written.',true],
           ['Day 0','Proposal requested','We asked for a proposal on 99.3% of these wins, almost always the same day.',false],
           ['Day 1.5','Proposal submitted','The one step that&rsquo;s entirely yours.',true],
           ['Day 3.0','Proposal approved','',false],
           ['Day 6.7','Contract created','',false],
           ['Day 8.6','Both sides signed','The middle half of engagements land somewhere between 2.9 and 20.2 days.',true]],
         reads:'<b>Read it as:</b> once the brief exists, the platform part of an invitation-only engagement takes a median of 8.6 days from brief to both signatures, and the proposal is the step you control. <b>One thing to know:</b> these are medians for each step measured on its own, across new engagements with extensions and internal accounts taken out. The signing figure covers only the engagements where both signatures were recorded on the platform. They don&rsquo;t add up neatly, and the platform can&rsquo;t see the conversation before the brief, which is where the real decision gets made.'},
        {type:'stack',title:'Who gets invited: the winner&rsquo;s track record before the invitation',unit:'% of new invitation-only wins, briefs created July 2025 to August 2026',
         cats:[['Had already delivered for that same client','var(--accent)'],['Had delivered for a different Catalant client','var(--blue-700)'],['First win on Catalant','var(--blue-300)']],
         rows:[['Invited wins',[48.3,28.9,22.8]]],
         reads:'<b>Read it as:</b> 48.3% of invitation-only wins went to a consultant who&rsquo;d already delivered work for that same client through Catalant, on a separate earlier brief, not an extension. Another 28.9% went to someone who&rsquo;d delivered for a different Catalant client. And 22.8%, more than one in five, went to a consultant winning on Catalant for the first time. <b>One thing to know:</b> &ldquo;same client&rdquo; means the same client account on our platform, and prior work counts any earlier engagement that was won, active or completed. Internal and catch-all accounts are excluded.',
         sowhat:'Repeat business is the biggest single way into invited work, which brings us back to Issue 3: how the client feels about this engagement decides who gets the next one. If you haven&rsquo;t won here yet, more than one in five invited wins went to someone in exactly your position. The best way to be next is in the news above: a complete Digital Twin so AI Search can find you, and same-day replies when a Client Team reaches out, because response time affects how you rank.'}
      ]}

  essay:{
    h:'Almost nobody praises the analysis.',
    ps:[
      'We read every recorded client conversation we have and pulled out the things a client said in their own words and went looking for what they say about you. The finding that stopped me is what is missing. Clients almost never praise the analysis. They praise the presence. &ldquo;An extension of the team.&rdquo; &ldquo;Rolled up the sleeves and is very much in the detail.&rdquo; &ldquo;That is why I don&rsquo;t want to let him go.&rdquo; And when it goes wrong, the complaint is almost never that the thinking was weak. It is that the work took too long to get going, or the client had to chase you, or the quality did not match the invoice. We are all trained to believe we are hired for the quality of our judgment. The record says clients assume the judgment and hire for how it feels to work with you.',
      'That is not a soft finding, because there is money attached to it. A third of engagements that started in 2024 and 2025 have been extended, and the extensions on a given engagement are worth, in total, about as much again as the original. So the second half of your income here is not sold. It is earned in the first three weeks, by somebody deciding they do not want you to leave. By the time you are thinking about what comes next, the client has usually already decided. Everything below is about the gap between those two moments.'
    ]
  },
  sections:[
    { k:'Demand trends', id:'sec-demand',
      analysis:'Here is what clients are asking for right now, and it has moved. Two clusters crossed in the last twelve months: AI and automation work nearly quadrupled while growth and commercial work halved. Underneath that, the language in the briefs themselves has changed in a way that is more useful to you than the category labels. Clients are increasingly asking to be told what is wrong before they commit to fixing it, and increasingly buying a person for a period rather than a report for a price. One myth we can retire: clients have not swung from growth to cost. Both are flat. What has actually changed is the appetite for a small, provable first step.',
      blocks:[
        {type:'two',title:'What clients are buying: the two clusters that crossed',unit:'Share of classified briefs, prior 12 months against last 12 months',
         left:{h:'Prior 12 months',rows:[['Deal work',14.2],['Integration',3.3],['Separation and carve-out',1.4],['Growth and commercial',14.9],['AI and automation',2.1],['AI proof of concept',0.4]]},
         right:{h:'Last 12 months',rows:[['Deal work',16.3],['Integration',5.1],['Separation and carve-out',2.8],['Growth and commercial',7.9],['AI and automation',7.9],['AI proof of concept',3.1]]},
         reads:'<b>Read it as:</b> two lines crossed. Growth and commercial work, go-to-market, marketing strategy, competitive benchmarking, fell from roughly one brief in seven to one in thirteen. AI and automation work went the other way, from 2.1% of classified briefs to 7.9%, with AI proof-of-concept development alone going from 0.4% to 3.1%. Deal work grew too, and it grew in the parts that come after a transaction closes rather than before it: integration went from 3.3% to 5.1% and separation and carve-out from 1.4% to 2.8%, while due diligence was flat. <b>One thing to know:</b> we can only classify project type on briefs that get far enough to be typed, so read this as the shape of demand, not a census.',
         sowhat:'If your positioning is built on growth strategy, the volume of briefs asking for it in those words has halved. That is not a reason to change what you are good at, it is a reason to change the first sentence. The same commercial judgment, described as an assessment or a diagnostic, is meeting a market that grew. And if you have implemented anything post-close, integration and carve-out work is where the deal cycle is buying right now.'},
        {type:'mom',title:'How clients describe the work: the language in the brief itself',unit:'% of briefs containing this language, by half-year',first:'Language in the brief',cols:['2024 H2','2025 H2','2026 H1'],last:'What it signals',
         rows:[
           ['Diagnostic or assessment',14.2,20.5,23.1,'Tell me what is wrong before I commit to a fix'],
           ['Fractional or interim',9.8,13.2,21.3,'Buying a person for a period, not a report'],
           ['Pilot, phase one or proof of concept',3.4,6.1,10.3,'Scope the smallest provable thing'],
           ['AI mentioned anywhere',5.0,10.8,20.4,'One brief in five now says the word'],
           ['Cost or margin',14.2,17.1,16.5,'Flat. Not the swing everyone assumes'],
           ['Growth or revenue',3.7,4.7,4.7,'Also flat, and smaller than you would guess']],
         reads:'<b>Read it as:</b> three kinds of language have grown fast and two have not moved at all. Diagnostic and assessment language is now in nearly a quarter of briefs. Fractional and interim language has more than doubled to 21.3%. Pilot and phase-one language has tripled. Meanwhile the cost-versus-growth story that everyone tells about this market is not in the data: cost and margin language is flat at around one brief in six, and growth and revenue language is flat at under one in twenty. <b>One thing to know:</b> this is keyword presence in brief text, so it undercounts briefs that mean the same thing in different words. Treat the direction as solid and the level as a floor.',
         sowhat:'Three practical moves. Lead with a diagnostic, not a solution, because that is what is being asked for. Offer a phase one that is genuinely small and genuinely provable, because that is how clients are de-risking. And if you would take a fractional or interim role, say so explicitly on your profile, because that ask has doubled in eighteen months and it is the single fastest-growing way clients are describing what they want.'}
      ]},
    { k:'Buyer decision trends', id:'sec-buyer',
      analysis:'This was far and away the most requested topic in the last round of feedback: what clients say when an engagement goes well, and when it does not. The quotes below are all verbatim, anonymized, from mid-engagement check-ins and closing conversations rather than selection calls. Positive comments outnumber negative ones by roughly two to one, which is the good news. What matters more is what each side is about. In the positive quotes, clients almost never praise the analysis. In the negative quotes, they almost never criticize it.',
      blocks:[
        {type:'quotes',title:'What clients say when an engagement is going well',unit:'Verbatim client comments from recorded conversations, anonymized',
         qs:[
           ['She essentially has been a part of the team, an extension of the team. So grateful, it was such a positive experience overall.','Closing conversation, consumer'],
           ['He&rsquo;s really rolled up the sleeves and is very much in the detail, driving the work forward.','Mid-engagement check-in, industrials'],
           ['He&rsquo;s very much part of the team. That&rsquo;s why I don&rsquo;t want to let him go.','Extension conversation, technology'],
           ['We love having somebody who has the company knowledge so they can just come in and hit the ground running.','Repeat engagement, food and beverage'],
           ['One of the main reasons we went with him again. Just as strong as we saw before.','Second engagement with the same consultant'],
           ['I&rsquo;m very happy with the work he&rsquo;s doing and the scholarship he&rsquo;s bringing to the project. No complaints.','Mid-engagement check-in, life sciences'],
           ['If we were to do phase two, I would stick with him. I think they&rsquo;ve been excellent.','End of phase one, industrials']],
         reads:'<b>The pattern:</b> read those again and notice what is absent. Nobody says the model was rigorous, the framework was sharp or the recommendation was right. They say part of the team, in the detail, hit the ground running, don&rsquo;t want to let him go. The one word that does point at substance is &ldquo;scholarship,&rdquo; and even there it is bracketed by &ldquo;no complaints.&rdquo; Clients treat the quality of your thinking as the price of entry. What they actually evaluate, and what they say out loud to us, is whether you feel like one of their people.',
         sowhat:'The behaviors clients name are all things you can decide to do in week one, and none of them require you to be smarter. Be in their channels rather than emailing a deck. Learn their vocabulary and their org chart before you need them. Say what you are doing this week without being asked. The phrase you are trying to earn is &ldquo;part of the team,&rdquo; because it is the phrase that appears immediately before someone decides to extend you.'},
        {type:'quotes',title:'What clients say when it is not going well',unit:'Verbatim client comments from recorded conversations, anonymized',
         qs:[
           ['We&rsquo;ve seen the quality not match what we feel like we&rsquo;re paying for, which has definitely caused some frustration on the deal team side.','Mid-engagement, private equity'],
           ['It took longer to start kicking into gear than I would have liked.','Check-in, enterprise'],
           ['He could have moved faster, but he didn&rsquo;t know he needed to. I just want to throw that out there. It happens sometimes.','Check-in, industrials'],
           ['It&rsquo;s been hard to get a hold of him. He pinged me this morning and said he&rsquo;s got a lot going on.','Scheduling a review, technology'],
           ['The first two weeks have gone as expected. No red flags, but it hasn&rsquo;t been much of a test.','Two weeks in, healthcare']],
         reads:'<b>The pattern:</b> not one of these is about the thinking. Three of the five are about pace, one is about reachability, and one is about value for money, which is really pace wearing a different hat. The third quote is the one to sit with, because the client is being generous: he could have moved faster, but he didn&rsquo;t know he needed to. That is an expectations failure, not a performance failure, and it is entirely preventable. The fifth is a warning of a different kind. Two weeks of no red flags is not a good review. It is a client telling us they have not seen anything yet.',
         sowhat:'Ask two questions in the first week that most consultants never ask. First, what does fast look like to you on this? Clients carry an unspoken pace expectation and will answer honestly if asked. Second, what is the first thing you want to be able to show someone else? That gives you a visible artifact early, which is the only real defense against &ldquo;it hasn&rsquo;t been much of a test.&rdquo; One client summed up the recoverable version of all of this: &ldquo;that was the only constructive feedback I had, but we got it aligned really quickly and we&rsquo;ve been on the same page since.&rdquo; Almost all of it is recoverable, if you hear it.'},
        {type:'coach',title:'What actually decides the client&rsquo;s verdict',unit:'Drawn from the recorded conversations above, ordered by how often it comes up',
         h:'Five things clients notice, and none of them are your analysis',
         items:[
           '<b>Speed of first visible output.</b> The most common complaint by a distance is pace, and specifically pace at the start. Get something in front of the client inside the first two weeks even if it is rough and clearly labeled as rough. A working draft in week two buys you more credit than a polished one in week five.',
           '<b>Being reachable.</b> &ldquo;Hard to get a hold of him&rdquo; is a sentence that ends engagements. If you are running several clients, tell each of them your actual availability pattern up front. Clients are fine with a consultant who is in on Tuesdays and Thursdays. They are not fine with a consultant who is unpredictable.',
           '<b>Being in the detail.</b> The praise clients give is physical: rolled up the sleeves, in the detail, driving the work forward. Seniority is not a reason to stay at altitude. The clients who extend people describe them doing the work, not directing it.',
           '<b>Naming the pace expectation out loud.</b> &ldquo;He could have moved faster, but he didn&rsquo;t know he needed to&rdquo; is the most fixable sentence in this entire issue. Ask in week one what fast looks like to them, and then say what you will have done by when.',
           '<b>Belonging to the team.</b> The single highest-value phrase in the corpus is &ldquo;part of the team,&rdquo; and it shows up right before extension conversations. Join their standup. Use their tools. Learn the names. It costs nothing and it is what the money follows.']}
      ]},
    { k:'Outcomes', id:'sec-outcomes',
      analysis:'The other most requested topic was how often engagements get extended and what an extension is actually worth. This is the part of the issue that puts a number on everything above. If the client&rsquo;s verdict is formed in the first three weeks, the extension is where that verdict gets paid out, and it is a much larger share of the money than most people assume.',
      blocks:[
        {type:'dist',title:'How often engagements get extended',unit:'Share of engagements that went on to be extended at least once, by the year the engagement started',
         rows:[['2021 starts',27.1,false],['2022 starts',27.0,false],['2023 starts',31.1,false],['2024 starts',32.9,true],['2025 starts',33.2,true]],
         reads:'<b>Read it as:</b> extensions have gone from roughly one engagement in four to one in three, and the level has held for two years running. To check that this is not just older cohorts having had more time, we also measured extensions created within 90 days of the engagement starting: 13.7% for 2023, 15.5% for 2024 and 15.5% for 2025. Same picture, like for like. <b>One thing to know:</b> 2026 starts are deliberately excluded. They currently read 20.1%, but that is censoring, not a decline. Most of those engagements have not reached the point where an extension would be created yet, and publishing that number would be a straightforward error.',
         sowhat:'A third of the engagements you take will be extended, and you cannot tell in advance which third. Behave on every engagement as though it is the one, because the client decides much earlier than you think.'},
        {type:'rank',title:'What an extension is worth',unit:'Median values across all extended engagements',fmt:'usd',
         rows:[['Median original engagement',38500,'var(--blue-300)'],['Median first extension',21000,'var(--blue)'],['Median of all extensions combined',33750,'var(--accent)']],
         reads:'<b>Read it as:</b> the first extension is worth about 0.62 times the original engagement, which sounds modest until you notice that 39.0% of extended engagements get extended more than once. Add all the extensions on a given engagement together and the median comes to $33,750 against a median original of $38,500. That is a ratio of 1.00. When an engagement extends, it tends to double. <b>One thing to know:</b> these are medians of separate distributions rather than a paired ratio, so treat 1.00 as a striking coincidence rather than a law of nature. The direction is not in doubt.',
         sowhat:'Roughly half the money available to you on an extended engagement is not in the contract you signed. It is in the relationship you build while delivering it. If you have been optimizing the initial negotiation and coasting on delivery, you have the effort allocated backwards.'}
      ]},
    { k:'Supply trends', id:'sec-supply',
      analysis:'You asked how experienced the people you work alongside on the platform are. The network is younger than most of you would guess: more than half of approved consultants have under fifteen years of experience. The people winning work are not. Every band of experience wins more work relative to its size than the band below it, and the most senior band wins at well over twice its share of the network. Experience does not guarantee the work, but it is the clearest single dividing line we can see between who is on the platform and who is delivering on it.',
      blocks:[
        {type:'stack',title:'Who is on the platform, and who is winning the work, by years of experience',unit:'% of consultants in each experience band',
         cats:[['Under 10 years','var(--blue-300)'],['10 to 15 years','var(--blue)'],['15 to 20 years','var(--blue-700)'],['20 to 25 years','var(--blue-900)'],['25 years and above','var(--accent)']],
         rows:[['On the platform',[28.7,27.1,19.3,11.9,12.9]],['Won work',[9.4,19.3,21.9,18.9,30.5]]],
         reads:'<b>Read it as:</b> of the roughly fifty thousand approved consultants on the platform, 28.7% have under ten years of experience, 27.1% have ten to fifteen, 19.3% fifteen to twenty, 11.9% twenty to twenty five, and 12.9% twenty five or more. Among the consultants who won work in the last twelve months the picture flips. Under ten years falls to 9.4%, ten to fifteen to 19.3%, while fifteen to twenty rises to 21.9%, twenty to twenty five to 18.9%, and twenty five and above to 30.5%. The median approved consultant has 13 years of experience. The median winner has 19. <b>One thing to know:</b> experience is measured from the start of the earliest role listed on each profile, so it counts early-career roles and undercounts anyone who has trimmed their history. Winners are consultants on engaged or completed work created in the last twelve months.',
         sowhat:'Years help, but they are not the whole story. Nearly three in ten winners have under fifteen years of experience, and everything earlier in this issue says clients decide on how it feels to work with you. If you are earlier in your career, the path in is depth in one area and prior context with an account rather than breadth. If you are more senior, do not let your years do the talking. Show what you did with them, with a concrete, comparable example.'}
      ]}

  essay:{
    h:'We&rsquo;re getting out of the business of making you compete.',
    ps:[
      'Two years ago, roughly one in three engagements on Catalant started with us bringing a single consultant to a client. So far this quarter it&rsquo;s two in three. Nobody announced that shift. It happened one Client Partner at a time, because it just works better for everyone involved. The client gets one person who has clearly been chosen for them, that person gets a real conversation instead of a pitch, and the whole thing closes in days rather than weeks. The auction was how we got started. The invitation is how we&rsquo;re going to grow.',
      'That puts a different question in front of you, and honestly in front of us too. On a posted brief, the job was to stand out among a crowd, and the crowd has only gotten bigger. On an invited brief, the job is to be the person a Client Partner thinks of first for a specific kind of problem, and then to help them win it as one team. Those are different skills, and the second one is more learnable than it looks. Plenty of you already have it. The One Team sessions this month were the start of teaching it. The data below shows you why we&rsquo;re so sure this is the right bet, and where the time goes when a deal drags.'
    ]
  },
  sections:[
    { k:'Demand trends', id:'sec-demand',
      analysis:'We heard from you that you&rsquo;d like to know more about which industries and buyer types are most active right now, so we built this section to answer them. The headline is that the buyer has moved: away from corporate strategy and the executive suite, toward private equity portfolio teams and the line functions that have to live with the result. Who the buyer is, their function and level, shapes the brief far more than the industry does. It also shapes whether the brief turns into an engagement at all. If you usually think about your positioning by industry, try to instead think about it by who owns the problem and what they need to hear.',
      blocks:[
        {type:'mom',title:'Who is buying: the function of the person who owns the brief',unit:'% of briefs where the buyer&rsquo;s function is known, by year',first:'Buyer function',cols:['2024','2025','2026 to date'],last:'What is happening',
         rows:[
           ['Portfolio operations (PE)',12.4,18.2,22.1,'Largest buyer function, and growing every year'],
           ['Operations and supply chain',9.2,9.0,11.5,'Line operators buying execution help'],
           ['Internal consulting and strategy teams',7.9,6.7,9.6,'Chiefs of staff and internal consulting groups'],
           ['Investing and deal teams (PE)',9.1,8.2,9.4,'Diligence and pre-close work'],
           ['Executive and general management',11.1,8.1,8.8,'CEOs, presidents and GMs'],
           ['Marketing',10.0,9.3,8.1,'Steady but slowly shrinking share'],
           ['Human resources',5.1,7.8,7.9,'Has grown from a small base'],
           ['Corporate strategy',11.2,8.8,6.7,'The classic consulting buyer, shrinking'],
           ['Finance',5.2,3.7,3.5,'Smaller than most expect'],
           ['Transformation office',3.2,5.2,2.3,'Spiked in 2025, faded this year']],
         reads:'<b>Read it as:</b> the buyer has moved from the center to the edges of the organization. In 2024 the two classic consulting buyers, corporate strategy and the C-suite, owned more than one in five briefs between them. This year it&rsquo;s about one in six, while portfolio operations teams at private equity firms have gone from one in eight briefs to more than one in five, and line functions, operations, supply chain and HR, have all grown. There&rsquo;s also a conversion story here, and it matters more than the mix. Briefs owned by someone with the operating problem, in marketing, HR, operations or an internal consulting team, become engagements at two to three times the rate of briefs owned by a portfolio operations or deal team sourcing on behalf of a company they don&rsquo;t run. <b>One thing to know:</b> we can only see function for about three in ten briefs, the ones where the brief owner is a contact we have on record. So read these as the shape of the market, not a census.',
         sowhat:'Your buyer is increasingly the person who has to live with the result, not the person whose job is to buy consulting. Write your profile and run your first call for an operator: what changed, how fast, and what it took from their team. When the buyer is a portfolio operations or deal team, expect a longer road and a second buyer inside the company, and ask early who that&rsquo;s.'},
        {type:'stack',title:'How senior is the buyer: the level of the person who owns the brief',unit:'% of briefs where the buyer&rsquo;s title is known, by period',
         cats:[['C-suite, president or MD','var(--blue-900)'],['Investor: partner, principal, associate','var(--accent)'],['VP, SVP or EVP','var(--blue-700)'],['Director or head of','var(--blue)'],['Manager and other','var(--blue-300)']],
         rows:[['2024',[10.8,19.4,21.9,27.7,20.1]],['2025',[16.9,19.0,18.4,25.8,19.9]],['2026 to date',[17.4,22.1,17.9,21.8,20.8]],['Last 90 days',[17.0,24.8,13.1,24.8,20.2]]],
         reads:'<b>Read it as:</b> the C-suite share of briefs has risen from roughly one in nine in 2024 to one in six this year, and investors, partners, principals and associates at PE firms, are now the single largest level, a quarter of briefs in the last 90 days. The middle, VPs and SVPs, is where the share has come out. A brief owned by a director or a manager converts to an engagement at roughly twice the rate of one owned by a C-suite executive or an investor, because the director already has a mandate and a budget line, while the executive is often still deciding whether to do the work at all.',

function svgGap(b){
  const W=760,H=310,L=44,R=150,T=16,B=42, ymax=60;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=15){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  const top=b.said.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const bot=b.bought.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
  g+=`<polygon points="${top} ${bot}" fill="var(--accent)" opacity="0.13"/>`;
  b.x.forEach((q,i)=>{
    const gap=pct(b.said[i]-b.bought[i]);
    const my=(y(b.said[i])+y(b.bought[i]))/2;
    g+=`<text class="endl" x="${x(i)}" y="${my+3.5}" text-anchor="middle" fill="var(--accent-ink)" font-size="10.5">${gap} pts</text>`;
  });
  const line=(d,c,w)=>{
    let o=`<polyline points="${d.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    d.forEach((v,i)=>{ o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="${c}"/>`; });
    return o;
  };
  g+=line(b.said,'var(--accent)',2.6);
  g+=line(b.bought,'var(--blue-900)',2.6);
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.said[n-1])+3.5}" fill="var(--accent)">${pct(b.said[n-1])}% <tspan font-weight="500" font-size="9.5">of client conversations</tspan></text>`;
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.bought[n-1])+3.5}" fill="var(--blue-900)">${pct(b.bought[n-1])}% <tspan font-weight="500" font-size="9.5">of project briefs</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function svgLine(b){
  const W=760,H=300,L=44,R=170,T=22,B=42, ymax=b.ymax||70;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=10){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  g+=`<polyline points="${b.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  b.vals.forEach((v,i)=>{
    const last = b.openLast && i===n-1;
    g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.2" fill="${last?'var(--paper)':'var(--accent)'}" stroke="var(--accent)" stroke-width="2.2"/>`;
    g+=`<text class="endl" x="${x(i)}" y="${y(v)-10}" text-anchor="middle" fill="var(--accent-ink)" font-size="11">${pct(v)}</text>`;
  });
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.vals[n-1])+3.5}" fill="var(--accent)">${pct(b.vals[n-1])}% <tspan font-weight="500" font-size="9.5">${b.endLabel||''}</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function svgShift(b){
  const W=760,H=300,L=44,R=170,T=16,B=42, ymax=b.ymax||70;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=10){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  const top=b.wins.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const bot=b.briefs.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
  g+=`<polygon points="${top} ${bot}" fill="var(--accent)" opacity="0.10"/>`;
  const line=(d,c,w,dash)=>{
    let o=`<polyline points="${d.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    d.forEach((v,i)=>{ o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="${c}"/>`; });
    return o;
  };
  g+=line(b.briefs,'var(--blue-900)',2.4);
  g+=line(b.wins,'var(--accent)',2.6);
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.wins[n-1])+3.5}" fill="var(--accent)">${pct(b.wins[n-1])}% <tspan font-weight="500" font-size="9.5">${b.winsLabel||'of engagements won'}</tspan></text>`;
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.briefs[n-1])+3.5}" fill="var(--blue-900)">${pct(b.briefs[n-1])}% <tspan font-weight="500" font-size="9.5">${b.briefsLabel||'of new briefs'}</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function dist(b){
  const mx=Math.max(...b.rows.map(r=>r[1]));
  return `<div class="rk">`+b.rows.map(([lab,v,hot])=>
    `<div class="rkrow" style="grid-template-columns:1fr 58px">
       <div class="lab"><i class="bar" style="width:${Math.max(4,v/mx*180)}px;background:${hot?'var(--accent)':'var(--blue-300)'}"></i><span style="${hot?'font-weight:600':''}">${lab}</span></div>
       <div class="v tnum" style="color:${hot?'var(--accent)':'var(--ink-3)'}">${pct(v)}%</div></div>`).join('')+`</div>`;
}

function rank(b){
  const mx=Math.max(...b.rows.map(r=>r[1]));
  const fmt = b.fmt==='usd' ? usd : num;
  const wide = b.fmt==='usd' ? ' style="grid-template-columns:1fr 78px"' : '';
  return `<div class="rk">`+b.rows.map(([n,v,c])=>
    `<div class="rkrow"${wide}><div class="lab"><i class="bar" style="width:${Math.max(6,v/mx*140)}px;background:${c}"></i><span>${n}</span></div>
     <div class="v tnum" style="color:${c==='var(--accent)'?'var(--accent)':'var(--ink-2)'}">${fmt(v)}</div></div>`).join('')+`</div>`;
}

function quotes(b){
  return `<div class="qs">`+b.qs.map(([t,c])=>`<div class="q">&ldquo;${t}&rdquo;<cite>${c}</cite></div>`).join('')+`</div>`;
}

function stack(b){
  return `<div class="stack">`+b.rows.map(([lab,vals])=>
    `<div class="strow"><div class="lab">${lab}</div><div class="stbar">`+
    vals.map((v,i)=>`<i style="width:${v}%;background:${b.cats[i][1]}" title="${b.cats[i][0]}: ${pct(v)}%">${v>=9?pct(v)+'%':''}</i>`).join('')+
    `</div></div>`).join('')+`</div><div class="legend">`+b.cats.map(([n,c])=>`<span style="--c:${c}">${n}</span>`).join('')+`</div>`;
}

function mom(b){
  const arrow=(a,c)=>{ const d=Math.round((c-a)*10)/10; if(d===0) return `<span class="fl">0.0 pts</span>`; return d>0?`<span class="up">&#9650; ${pct(d)} pts</span>`:`<span class="dn">&#9660; ${pct(-d)} pts</span>`; };
  return `<div class="momwrap"><table class="mom"><thead><tr><th>${b.first||'Industry'}</th><th>${(b.cols||['2025','2026 to date','Last 90 days'])[0]}</th><th>${(b.cols||['2025','2026 to date','Last 90 days'])[1]}</th><th>${(b.cols||['2025','2026 to date','Last 90 days'])[2]}</th><th>Move</th><th style="text-align:left">${b.last||'Who is buying'}</th></tr></thead><tbody>`+
    b.rows.map(([n,a,c,d,who])=>`<tr><td class="name">${n}</td><td>${pct(a)}%</td><td>${pct(c)}%</td><td>${pct(d)}%</td><td>${arrow(a,d)}</td><td class="who">${who}</td></tr>`).join('')+
    `</tbody></table></div>`;
}

function two(b){
  const col=(c,hot)=>{ const mx=Math.max(...c.rows.map(r=>r[1]));
    return `<div><h5>${c.h}</h5><div class="rk">`+c.rows.map(([n,v])=>`<div class="rkrow" style="grid-template-columns:1fr 50px"><div class="lab"><i class="bar" style="width:${Math.max(6,v/mx*110)}px;background:${hot}"></i><span>${n}</span></div><div class="v tnum">${pct(v)}%</div></div>`).join('')+`</div></div>`; };
  return `<div class="two">${col(b.left,'var(--accent)')}${col(b.right,'var(--blue-900)')}</div>`;
}

function stages(b){
  const max=Math.max(...b.rows.map(r=>r.total));
  return `<div class="stages">`+b.rows.map(r=>{
    const shown=r.segs.reduce((a,c)=>a+c,0);
    const rest=Math.max(0,r.total-shown);
    let segs=r.segs.map((v,i)=>v>0?`<i style="width:${v/max*100}%;background:${b.key[i][1]}" title="${b.key[i][0]}: ${pct(v)} days">${v/max>0.07?`<span>${pct(v)}<small> d</small></span>`:''}</i>`:'').join('');
    if(rest>0) segs+=`<i class="rest" style="width:${rest/max*100}%" title="${r.rest}">${rest/max>0.15?`<span>${pct(rest)} days between steps</span>`:''}</i>`;
    return `<div class="stg"><div class="hd"><b>${r.lab}</b><span>median <b>${pct(r.total)}</b> days brief to contract</span></div><div class="track">${segs}</div><div class="stgnote">${r.total/max<0.2?`<b>${pct(r.total)} days end to end.</b> `:''}${r.rest}</div></div>`;
  }).join('')+`</div><div class="stgkey">`+b.key.map(([n,c])=>`<span style="--c:${c}">${n}</span>`).join('')+`<span style="--c:var(--hair)">Time between steps</span></div>`;
}

function dot3(b){
  return `<div class="dot3">`+b.boxes.map(bx=>{ const mx=Math.max(...bx.rows.map(r=>r[1]));
    return `<div class="dbox"><h5>${bx.h}</h5>`+bx.rows.map(([n,v,hot])=>`<div class="drow${hot?' hot':''}"><div><div style="margin-bottom:4px">${n}</div><div class="bar" style="width:${v/mx*100}%"></div></div><div class="v">${pct(v)}</div></div>`).join('')+`</div>`; }).join('')+`</div>`;
}

function funnel(b){
  const mx=b.rows[0][1];
  return `<div class="funnel">`+b.rows.map(([n,v,sub,hot])=>`<div class="frow${hot?' hot':''}"><div class="lab">${n}${sub?`<span class="sub">${sub}</span>`:''}</div><div><div class="fb" style="width:${Math.max(1.2,v/mx*100)}%"></div></div><div class="v">${hot?'1':'~'+num(v)}</div></div>`).join('')+`</div>`;
}

function coach(b){
  return `<div class="coach"><div class="ch">${b.h}</div><ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol></div>`;
}

function cmp(b){
  return `<div class="cmp"><div class="cmprow hd"><span></span><span>Won</span><span>Not won</span></div>`+b.rows.map(([lab,wt,lt,wv,lv])=>{
    const mx=Math.max(wv,lv)||1;
    return `<div class="cmprow"><div class="lab">${lab}</div>
      <div class="cmpcell win"><span class="v">${wt}</span><i class="bar" style="width:${Math.max(4,wv/mx*100)}%"></i></div>
      <div class="cmpcell"><span class="v">${lt}</span><i class="bar" style="width:${Math.max(4,lv/mx*100)}%"></i></div></div>`;
  }).join('')+`</div>`;
}

function steps(b){
  return `<ol class="steps">`+b.steps.map(([day,lab,txt,hot])=>
    `<li class="${hot?'hot':''}"><div class="sday">${day}</div><div class="sbody"><b>${lab}</b>${txt?`<p>${txt}</p>`:''}</div></li>`).join('')+`</ol>`;
}

function renderBlock(b){
  let body='';
  if(b.type==='cmp') body=cmp(b);
  else if(b.type==='steps') body=steps(b);
  else
  if(b.type==='gap') body=svgGap(b);
  else if(b.type==='shift') body=svgShift(b);
  else if(b.type==='line') body=svgLine(b);
  else if(b.type==='rank') body=rank(b);
  else if(b.type==='quotes') body=quotes(b);
  else if(b.type==='dist') body=dist(b);
  else if(b.type==='stack') body=stack(b);
  else if(b.type==='mom') body=mom(b);
  else if(b.type==='two') body=two(b);
  else if(b.type==='stages') body=stages(b);
  else if(b.type==='dot3') body=dot3(b);
  else if(b.type==='funnel') body=funnel(b);
  else if(b.type==='coach') body=coach(b);
  const unit = b.unit ? `<div class="unit">${b.unit}</div>` : '';
  return `<div class="ex">
    <div class="exh"><h4>${b.title}</h4>${unit}</div>
    <div class="exb">${body}${b.reads?`<div class="reads">${b.reads}</div>`:''}${b.sowhat?`<div class="sowhat"><span class="lbl">So what</span>${b.sowhat}</div>`:''}</div>
  </div>`;
}

function partHead(num,label){
  return `<div class="parthead"><span class="num">${num}</span><h2>${label}</h2><span class="line"></span></div>`;

  h += `<section class="part">${partHead(WORDS[p++],'The data')}`;
  s.sections.forEach(sec=>{
    h += `<div class="sect"${sec.id?` id="${sec.id}"`:''}><div class="secthead"><h3>${sec.k}</h3><span class="r"></span></div>

    <p class="analysis" style="margin-bottom:18px;max-width:none">We want your feedback on how we can support you, and we&rsquo;re always looking for insights from you. Share your name if you&rsquo;re open to someone from the Catalant team following up. Answer whatever is useful, then hit <b>Submit feedback</b> at the end.</p>
    <div class="namerow">
      <label for="fbname">Your name</label>

      ${a.opts&&a.opts.length?`<div class="opts">${a.opts.map((o,n)=>`<button class="opt" data-o="${n}">${o}</button>`).join('')}</div>`:''}
      <textarea class="fld qc" id="qc${ai}" data-q="${ai}" rows="3" placeholder="${a.opts&&a.opts.length?'In your own words &mdash; anything you want to add':'Your answer, in your own words'}"></textarea>
    </div>`).join('')}
    <div class="ask partner">
      <h4>Are there accounts or clients where you have relationships and want to partner with Catalant?</h4>
      <p class="sub">If you know someone at a company we should be talking to, tell us and we will build the approach with you rather than around you. This is how a meaningful share of our best engagements start, and it is exactly the invited path described above.</p>
      <textarea class="fld" id="leadbox" rows="3" placeholder="The company or account, and anything useful about the relationship"></textarea>
    </div>
    <div class="submitbar">
      <button class="cta" id="submitall">Submit feedback</button>
      <p class="subnote" id="submitnote">Press Submit when you are done.</p>
      <p class="thanks" id="submitstatus" hidden></p>
    </div></section>`;

  if(s.next){
    h += `<section class="part" id="next">${partHead(WORDS[p++],s.nextLabel||'What is coming next')}
      <div class="nextb"><p style="font-size:13px;color:var(--ink-3)">In the next issue</p>
      <ul>${s.next.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`;
  }

  const older = ISSUES[idx+1], newer = ISSUES[idx-1];
  h += `<div class="pager">
    ${older?`<button class="pg" data-go="${idx+1}"><span class="k">Previous issue</span>No. ${older.no} &middot; ${older.short}</button>`:'<span></span>'}
    ${newer?`<button class="pg n" data-go="${idx-1}"><span class="k">Next issue</span>No. ${newer.no} &middot; ${newer.short}</button>`:'<span></span>'}
  </div>`;

  h += `<footer><p><b>How to read the numbers.</b> Everything about client demand is shown as a share, a direction or a rank, never as a count, a client name or a deal value. Our clients tell us things on the condition that we do not repeat them. Supply-side figures such as rates and practice area pool sizes are our own network&rsquo;s data and are shown directly.</p>
    <p style="margin-top:9px"><b>Where it comes from.</b> The Signal is written from the project briefs submitted to Catalant, the activity on the platform around them, and the client conversations our team records, read in full. Nothing in it identifies a client, a company or a transaction. Sales cycle is measured from the brief being created to a contract being created, on closed-won work only, and compared across the period in which the work closed. A private equity brief means the buying account sits in one of our PE client communities. Industry and project type are classified on briefs that progressed to a conversation. Internal and test records are excluded from every denominator.</p></footer>`;

  return h;
}

/* One record per reader per issue. Saved to the artifact's own store when this
   page runs inside claude.ai; otherwise Submit opens an email with the answers. */
const EMAIL = 'aewing@gocatalant.com';

/* Google Form behind the page. Off claude.ai there is no artifact store, so
   Submit posts here and responses collect as rows in one sheet. Field ids
   come from the form's pre-filled link; the reader never loads Google.
   Google sends no CORS headers on formResponse, so the post is opaque: a
   resolved fetch means the request left the browser, not that Google took it. */
const GFORM = 'https://docs.google.com/forms/d/e/1FAIpQLSfEmabD9UlhV3ETHwxfhD_MdyNesTFwIIRkuXm1w7E-bqareg/formResponse';
const GFIELD = {
  issue: 'entry.425341275',
  name:  'entry.1209004045',
  q1a:   'entry.627512676',  q1c: 'entry.19888420',
  q2a:   'entry.513025668',  q2c: 'entry.1819362405',
  q3c:   'entry.516265689',
  lead:  'entry.1481621610'
};

/* Every issue posts to the same sheet, so each row carries its issue number;
   the answer text alone can't tell them apart. Issues 2 and 3 ask three
   questions, issues 1 and 4 ask two, so q3 posts empty on those. */
function postToForm(state){
  const a = n => state.answers['q' + n] || {};
  const p = new URLSearchParams();
  p.append(GFIELD.issue, String(state.issue));
  p.append(GFIELD.name, state.name);
  p.append(GFIELD.q1a, a(1).answer  || '');
  p.append(GFIELD.q1c, a(1).comment || '');
  p.append(GFIELD.q2a, a(2).answer  || '');
  p.append(GFIELD.q2c, a(2).comment || '');
  p.append(GFIELD.q3c, a(3).comment || '');
  p.append(GFIELD.lead, state.lead);
  return fetch(GFORM, { method:'POST', mode:'no-cors', body:p })
    .then(function(){ return true; })
    .catch(function(){ return false; });
}

let dbNs = null;
