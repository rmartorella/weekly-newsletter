<script>
/* ============================================================ DATA */
const ISSUE = {
  no:1, date:'Friday 18 September 2026', tag:'Issue one',
  essay:{
    h:'Quality and reliability, without the rest of it.',
    ps:[
      'A third of the briefs we get now include a sentence that has nothing to do with the work. <em>Not a traditional big-firm advisory approach. The client does not seek recommendations or theories. This is not a role for a passive documenter. We are not seeking a team lead or a partner, low ego.</em> For a while I read those as clients turning against the big firms, and I no longer think that is right. Every one of those briefs still asks for the pedigree, and they still want the things a good firm genuinely delivers: rigour, a real answer, somebody who has done this before, and the confidence that it actually gets finished.',
      'What they are refusing is everything that has historically come attached to it. The layers, the bill, the theatre, and the person who needs the room to know how senior they are. That is not a rejection of consulting, it is a far more specific order than we used to get, and it is a hard order for a firm to fill and a natural one for an experienced operator working on their own. The consultants doing well here are not winning because they are cheaper. They are winning because they can be trusted to deliver like a firm and behave like a colleague, and the data further down this issue says the same thing from three different directions.'
    ]
  },
  sections:[
    { k:'Demand trends',
      analysis:'The most useful number we have on AI is not how much of it we are selling. It is the distance between how often clients raise it in the room and how often it survives into a brief. That gap has widened every year for three years running, and a gap that keeps widening is a forecast rather than a curiosity. It is also, we think, the clearest opportunity in this issue, and it is not an opportunity for AI specialists. It is one for people who already know an industry or a function cold and are willing to learn how AI applies to it.',
      blocks:[
        {type:'gap',title:'Said versus bought: AI in the conversation against AI in the brief',
         unit:'% mentioning AI, by year',freq:'Minimum monthly',
         x:['2024','2025','2026 to date'],
         said:[15.3,28.0,44.2], bought:[5.1,9.9,20.2],
         reads:'<b>Read it as:</b> AI now comes up in 44% of client conversations, close to triple where it was two years ago. It survives into 20% of the briefs those conversations produce. The gap has gone from ten points to twenty four, which means the talking is running well ahead of the buying and most of it has not been scoped yet. When AI comes up on a call and does not make the brief, it is almost never because the client decided against it. It is because nobody in the room could say what AI would concretely do inside their supply chain, their close process, their sales motion or their clinical operation. The brief that eventually gets written is for that operator, not for a data scientist. <b>Method:</b> full call transcripts, not summaries. Summaries compress and undercount this by roughly half.',
         sowhat:'This is an opportunity for subject matter experts, not for AI specialists. Do not rebrand yourself as an AI consultant. Pick the one or two places in your own field where AI is already changing how the work gets done, learn them properly, and put a concrete before-and-after example on your profile and in your first call. Write down the three questions a client in your field would ask about AI this year: if you cannot answer them today, that is your reading list for the next month. When a client raises AI, be the person who can say what it would do in their business, not what it is.'}
      ]},
    { k:'Buyer decision trends',
      analysis:'The most repeated rejection in our debriefs is not about capability. It is a version of I could not tell what I would actually get. Very few of the conversations we sit in on include a consultant putting an actual piece of work on the table, which makes one redacted deliverable from a comparable engagement rarer and more useful than a strong CV. The second most common loss reason is one nobody ever hears about, which is being too senior for the job the client actually needs done.',
      blocks:[
        {type:'quotes',title:'How buyers decide: what they said after passing',unit:'Client debriefs, anonymized',freq:'Minimum monthly',
         qs:[['He talked with a lot of jargon and I could not tease out what we are going to get.','After a first call, industrials'],
             ['I just need materials produced. His seventeen steps would take three months alone.','Chief of staff search, healthcare'],
             ['Too high level. I wanted policies, procedures and playbooks inside three months.','Six months into an org design engagement'],
             ['We picked him for prior knowledge of the company. He could have brought more industry perspective.','Selection debrief, and they were satisfied anyway']],
         reads:'<b>The pattern:</b> prior context with the account beats prestige, and it is not close. The ramp-time discount is worth more to a buyer than domain breadth, and they will say so out loud.',
         sowhat:'Bring one redacted deliverable from a comparable engagement to the first call and walk the client through it. Then say plainly what they will have in hand at the end of month one. If the brief asks for materials produced, do not pitch a diagnostic. Match the altitude of the job they are actually hiring for, even if you could operate several levels above it.'}
      ]},
    { k:'Supply trends',
      analysis:'Rates are what people have least visibility into and most anxiety about, so we will publish the shape of them regularly, and we will always talk in weekly and daily terms rather than hourly. This month we are showing only one group: consultants who won work on the platform in the last twelve months and have a rate on file. One honest caveat first. Engagements are priced as a total or by milestone, not as hours times a rate, so we cannot see what anyone actually earned per hour or per week on a given project. What follows is the rate these consultants report on their profile, which is the number a client sees when they are deciding. Read it as what winners ask for, not what winners were paid.',
      blocks:[
        {type:'dist',title:'What winning consultants list as their weekly rate',
         unit:'Share of consultants who won work in the last 12 months, by listed weekly rate',freq:'Monthly',
         rows:[['Under $6,000',1.5,false],['$6,000 to $8,000',12.0,false],['$8,000 to $10,000',29.2,true],['$10,000 to $12,000',23.0,true],['$12,000 to $15,000',26.7,true],['$15,000 and above',7.5,false]],
         reads:'<b>Read it as:</b> nearly eight in ten winners list between $8,000 and $15,000 a week, which at a five day week is roughly $1,600 to $3,000 a day. The median winner lists $10,000. For comparison, the median across everyone who was surfaced for work this year but did not win is $8,000, and the bottom quartile of winners starts at $8,000 where the bottom quartile of non-winners starts at $7,000. The lower end of the market is not where the work is being won. Undercutting does not appear to be a strategy that works here.',
         sowhat:'If your listed rate is below $8,000 a week, raise it. You are pricing yourself out of the group that wins, not into it. If you are already in the $8,000 to $15,000 range, hold it and compete on clarity of deliverable rather than on price.'},
        {type:'rank',title:'Median listed weekly rate of winners, by primary practice area',unit:'Median weekly rate, winners only, practice areas with at least 10 winners',freq:'Monthly',fmt:'usd',
         rows:[['AI / ML',12000,'var(--accent)'],['PMO / Transformation',11000,'var(--blue)'],['GTM Strategy',11000,'var(--blue)'],['Operations and Process Improvement',11000,'var(--blue)'],['M and A / CDD',10000,'var(--blue-300)'],['Private Equity',10000,'var(--blue-300)'],['Marketing',9000,'var(--blue-300)'],['Supply Chain',9000,'var(--blue-300)']],
         reads:'<b>Read it as:</b> nine to twelve thousand a week across every practice area with enough winners to report. The spread inside each practice area is wider than the spread between them, so rate is almost never the thing deciding an engagement. AI / ML is the one area where winners list a visibly higher number, which is the supply side of the demand story above. <b>Caveat:</b> practice-area groups here are small, less than 50 winners each, so treat the ordering as directional rather than a league table.',
         sowhat:'Do not adjust your rate because of your practice area. The market does not. If you are a subject matter expert who can credibly speak to AI in your field, you have a case for the top of your range, which is the one place the data shows a premium.'}
      ]}
  ],
  asks:[
    {q:'Which part of this issue was most useful to you?',
     sub:'This is the first issue we have sent outside the company, and we would rather build the next one around what you actually read than what we guessed you would read.',
     opts:['What we are seeing, the opening essay','Demand trends, the AI gap','Buyer decision trends, why clients pass','Supply trends, what winners charge']},
    {q:'What kind of data would be most useful in the next issue?',
     sub:'We have a lot more than we can fit in one issue. Tell us where to point it.',
     opts:['Which industries and buyer types are most active right now','How long it takes to win work, and what slows it down','How many people you are competing with on a typical project','Rates cut by years of experience and engagement type']}
  ]
};

/* ============================================================ RENDER */
const $ = s => document.querySelector(s);
const pct = v => Number(v).toFixed(1);
const usd = v => '$' + Number(v).toLocaleString('en-US');
const num = v => (typeof v==='number' ? v.toLocaleString('en-US') : v);

function svgGap(b){
  const W=760,H=310,L=44,R=150,T=16,B=42, ymax=60;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=15){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  const top=b.said.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const bot=b.bought.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
  g+=`<polygon points="${top} ${bot}" fill="var(--accent)" opacity="0.13"/>`;
  b.x.forEach((q,i)=>{
    const gap=pct(b.said[i]-b.bought[i]);
    const my=(y(b.said[i])+y(b.bought[i]))/2;
    g+=`<text class="endl" x="${x(i)}" y="${my+3.5}" text-anchor="middle" fill="var(--accent-ink)" font-size="10.5">${gap} pts</text>`;
  });
  const line=(d,c,w)=>{
    let o=`<polyline points="${d.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    d.forEach((v,i)=>{ o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="${c}"/>`; });
    return o;
  };
  g+=line(b.said,'var(--accent)',2.6);
  g+=line(b.bought,'var(--blue-900)',2.6);
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.said[n-1])+3.5}" fill="var(--accent)">${pct(b.said[n-1])}% <tspan font-weight="500" font-size="9.5">of client conversations</tspan></text>`;
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.bought[n-1])+3.5}" fill="var(--blue-900)">${pct(b.bought[n-1])}% <tspan font-weight="500" font-size="9.5">of project briefs</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function dist(b){
  const mx=Math.max(...b.rows.map(r=>r[1]));
  return `<div class="rk">`+b.rows.map(([lab,v,hot])=>
    `<div class="rkrow" style="grid-template-columns:1fr 58px">
       <div class="lab"><i class="bar" style="width:${Math.max(4,v/mx*180)}px;background:${hot?'var(--accent)':'var(--blue-300)'}"></i><span style="${hot?'font-weight:600':''}">${lab}</span></div>
       <div class="v tnum" style="color:${hot?'var(--accent)':'var(--ink-3)'}">${pct(v)}%</div></div>`).join('')+`</div>`;
}

function rank(b){
  const mx=Math.max(...b.rows.map(r=>r[1]));
  const fmt = b.fmt==='usd' ? usd : num;
  const wide = b.fmt==='usd' ? ' style="grid-template-columns:1fr 78px"' : '';
  return `<div class="rk">`+b.rows.map(([n,v,c])=>
    `<div class="rkrow"${wide}><div class="lab"><i class="bar" style="width:${Math.max(6,v/mx*140)}px;background:${c}"></i><span>${n}</span></div>
     <div class="v tnum" style="color:${c==='var(--accent)'?'var(--accent)':'var(--ink-2)'}">${fmt(v)}</div></div>`).join('')+`</div>`;
}

function quotes(b){
  return `<div class="qs">`+b.qs.map(([t,c])=>`<div class="q">&ldquo;${t}&rdquo;<cite>${c}</cite></div>`).join('')+`</div>`;
}

function renderBlock(b){
  let body='';
  if(b.type==='gap') body=svgGap(b);
  else if(b.type==='rank') body=rank(b);
  else if(b.type==='quotes') body=quotes(b);
  else if(b.type==='dist') body=dist(b);
  const unit = b.unit ? `<div class="unit">${b.unit}</div>` : '';
  return `<div class="ex">
    <div class="exh"><h4>${b.title}<span class="freq">${b.freq}</span></h4>${unit}</div>
    <div class="exb">${body}${b.reads?`<div class="reads">${b.reads}</div>`:''}${b.sowhat?`<div class="sowhat"><span class="lbl">So what</span>${b.sowhat}</div>`:''}</div>
  </div>`;
}

function partHead(num,label){
  return `<div class="parthead"><span class="num">${num}</span><h2>${label}</h2><span class="line"></span></div>`;
}

function renderIssue(s){
  let h = `<div class="masthead">
      <a class="fbbtn" href="#feedback">Feedback</a>
      <div class="mh">The Signal</div>
      <div class="dl">No. ${s.no}<br>${s.date}${s.tag?`<br><b>${s.tag}</b>`:''}</div>
    </div>`;

  h += `<section class="part">${partHead('One','What we are seeing')}
    <div class="essay"><h3>${s.essay.h}</h3>${s.essay.ps.map(p=>`<p>${p}</p>`).join('')}
    <div class="sign">Pat Petitti</div></div></section>`;

  h += `<section class="part">${partHead('Two','The data')}`;
  s.sections.forEach(sec=>{
    h += `<div class="sect"><div class="secthead"><h3>${sec.k}</h3><span class="r"></span></div>
      <p class="analysis">${sec.analysis}</p>
      ${sec.blocks.map(renderBlock).join('')}</div>`;
  });
  h += `</section>`;

  h += `<section class="part" id="feedback">${partHead('Three','Feedback and questions')}
    <p class="analysis" style="margin-bottom:18px;max-width:none">We want your feedback on how we can support you and we are always looking for insights from you. Please share your name if you&rsquo;re open to the Catalant team following up with you on your feedback. Answer whatever is useful, then press <b>Submit feedback</b> at the end.</p>
    <div class="namerow">
      <label for="fbname">Your name</label>
      <input class="fld" id="fbname" type="text" autocomplete="name" placeholder="Optional, only if you are open to a follow-up">
    </div>
    ${s.asks.map((a,ai)=>`<div class="ask" style="${ai>0?'margin-top:16px':''}"><h4>${a.q}</h4><p class="sub">${a.sub}</p>
      <div class="opts">${a.opts.map((o,n)=>`<button class="opt" data-o="${n}">${o}</button>`).join('')}</div>
      <textarea class="fld qc" id="qc${ai}" data-q="${ai}" rows="3" placeholder="In your own words &mdash; anything you want to add"></textarea>
    </div>`).join('')}
    <div class="ask partner">
      <h4>Are there accounts or clients where you have relationships and want to partner with Catalant?</h4>
      <p class="sub">If you know someone at a company we should be talking to, tell us and we will build the approach with you rather than around you. This is how a meaningful share of our best engagements start.</p>
      <textarea class="fld" id="leadbox" rows="3" placeholder="The company or account, and anything useful about the relationship"></textarea>
    </div>
    <div class="submitbar">
      <button class="cta" id="submitall">Submit feedback</button>
      <p class="subnote" id="submitnote">Answers are saved as you go. Press Submit when you are done so we know it is finished.</p>
      <p class="thanks" id="submitstatus" hidden></p>
    </div></section>`;

  h += `<footer><p><b>How to read the numbers.</b> Everything about client demand is shown as a share, a direction or a rank, never as a count, a client name or a deal value. Our clients tell us things on the condition that we do not repeat them. Supply-side figures such as rates and practice area pool sizes are our own network&rsquo;s data and are shown directly.</p>
    <p style="margin-top:9px"><b>Where it comes from.</b> The Signal is written from the project briefs submitted to Catalant and the client conversations our team records, read in full each week. Nothing in it identifies a client, a company or a transaction. AI mention rates are measured on full call transcripts rather than call summaries, which compress and undercount by roughly half. Internal and test records are excluded from every denominator.</p></footer>`;

  return h;
}

const m = $('#main');
m.innerHTML = renderIssue(ISSUE);
m.classList.add('fade');

/* ============================================================ FEEDBACK */
/* One document per reader in the artifact's own store. Nothing leaves the
   page unless the reader acts; the page never shows anyone else's answers. */

const EMAIL = 'pat@gocatalant.com';
const OFFLINE = 'Responses cannot be recorded in this view. Email ' + EMAIL + ' instead.';
const FAILED  = 'Could not save that just now. Try again, or email ' + EMAIL + '.';

const mkid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
let rid = null;
try{ rid = localStorage.getItem('signal-1-rid'); }catch(_){}
if(!rid){ rid = mkid(); try{ localStorage.setItem('signal-1-rid', rid); }catch(_){} }

const state = { answers:{}, name:'', lead:'', submitted:false, submittedAt:'' };
let dbOK = null;
const pending = new Map();
let docRef = null;

const dbInit = (async()=>{
  try{
    if(!window.claude || typeof claude.use !== 'function') return false;
    const db = await claude.use('db');
    if(!db) return false;
    docRef = db.doc('responses/' + rid);
    /* Load this reader's existing record first: every write replaces the whole
       document, so without this a second visit would blank their earlier answers. */
    try{
      const snap = await docRef.get();
      if(snap.exists) hydrate(snap.data() || {});
    }catch(_){}
    return true;
  }catch(_){ return false; }
})();

/* Restore a returning reader's own answers, without clobbering anything they
   have already typed in this visit. */
function hydrate(d){
  state.answers = (d.answers && typeof d.answers === 'object') ? JSON.parse(JSON.stringify(d.answers)) : {};
  state.name = d.name || '';
  state.lead = d.lead || '';
  const asks = Array.prototype.slice.call(document.querySelectorAll('.ask:not(.partner)'));
  asks.forEach((ask,qi)=>{
    const rec = state.answers['q'+(qi+1)];
    if(!rec) return;
    if(rec.answer && !ask.querySelector('.opt.on')){
      Array.prototype.forEach.call(ask.querySelectorAll('.opt'), b=>{
        if(b.textContent.trim() === rec.answer) b.classList.add('on');
      });
    }
    const box = ask.querySelector('.qc');
    if(box && !box.value.trim() && rec.comment) box.value = rec.comment;
  });
  const n = document.getElementById('fbname');
  if(n && !n.value.trim() && state.name) n.value = state.name;
  const l = document.getElementById('leadbox');
  if(l && !l.value.trim() && state.lead) l.value = state.lead;
  state.submitted = !!d.submitted;
  state.submittedAt = d.submittedAt || '';
  const b = document.getElementById('submitall');
  if(b && state.submitted) b.textContent = 'Update my response';
  setNote(state.submitted ? NOTE_DONE : (hasContent() ? NOTE_DIRTY : NOTE_IDLE), !state.submitted && hasContent());
}

function setStatus(el,msg,err){
  if(!el) return;
  el.textContent = msg || '';
  el.hidden = !msg;
  el.classList.toggle('err', !!err);
}

function flush(ok,code){
  pending.forEach((msg,el)=>{
    if(ok) setStatus(el,msg);
    else setStatus(el, (code==='not_granted'||code==='capability_disabled'||code==='revoked') ? OFFLINE : FAILED, true);
  });
  pending.clear();
}

async function save(){
  if(!docRef){ flush(false,'not_granted'); return false; }
  const body = {
    issue: ISSUE.no,
    answers: state.answers,
    name: state.name.slice(0,200),
    lead: state.lead.slice(0,4000),
    submitted: !!state.submitted,
    submittedAt: state.submittedAt || '',
    updatedAt: new Date().toISOString()
  };
  for(let attempt=0; attempt<2; attempt++){
    try{ await docRef.set(body); flush(true); return true; }
    catch(err){
      const code = err && err.code;
      if(code==='unavailable' && attempt===0){ await new Promise(r=>setTimeout(r, 400+Math.random()*400)); continue; }
      flush(false,code); return false;
    }
  }
  return false;
}

dbInit.then(function(ok){ dbOK = ok; if(!ok) setNote(NOTE_EMAIL, false); });

function emailBody(){
  const L = [];
  if(state.name) L.push('Name: ' + state.name);
  ISSUE.asks.forEach(function(a,i){
    const rec = state.answers['q'+(i+1)] || {};
    L.push('');
    L.push(a.q);
    L.push('  Answer: ' + (rec.answer || '(not answered)'));
    if(rec.comment) L.push('  Comment: ' + rec.comment);
  });
  if(state.lead){ L.push(''); L.push('Accounts to partner on:'); L.push(state.lead); }
  return L.join('\n');
}

/* mailto: has a practical length ceiling in some mail clients, so cap the
   body and tell the reader rather than silently dropping their words. */
function submitByEmail(){
  const MAX = 1500;
  let body = emailBody();
  let cut = false;
  if(body.length > MAX){ body = body.slice(0, MAX); cut = true; }
  if(cut) body += '\n\n[Message was too long to prefill in full — please paste the rest below.]';
  window.location.href = 'mailto:' + EMAIL
    + '?subject=' + encodeURIComponent('The Signal No. ' + ISSUE.no + ' \u2014 feedback')
    + '&body=' + encodeURIComponent(body);
  setStatus(submitSt, cut
    ? 'Opening your email app. Your answer was long, so please check nothing was cut off before sending.'
    : 'Opening your email app. If nothing happens, email ' + EMAIL + '.');
}

const askEls = Array.prototype.slice.call(document.querySelectorAll('.ask:not(.partner)'));

/* One slot per question, holding the option picked and whatever they wrote. */
function slot(qi){
  const k = 'q' + (qi+1);
  if(!state.answers[k]) state.answers[k] = { question: ISSUE.asks[qi] ? ISSUE.asks[qi].q : '', answer:'', comment:'' };
  return state.answers[k];
}

const nameInput = document.getElementById('fbname');
const leadBox   = document.getElementById('leadbox');
const submitBtn = document.getElementById('submitall');
const submitSt  = document.getElementById('submitstatus');
const submitNote= document.getElementById('submitnote');

const NOTE_IDLE  = 'Answers are saved as you go. Press Submit when you are done so we know it is finished.';
const NOTE_DIRTY = 'Draft saved, not submitted yet. Press Submit when you are done.';
const NOTE_DONE  = 'Submitted. You can change your answers and submit again any time.';
const NOTE_EMAIL = 'Submitting opens an email to ' + EMAIL + ' with your answers filled in.';

function setNote(msg,dirty){
  if(!submitNote) return;
  submitNote.textContent = msg;
  submitNote.classList.toggle('dirty', !!dirty);
}

/* Read the form into state. */
function collect(){
  askEls.forEach((ask,qi)=>{
    const picked = ask.querySelector('.opt.on');
    const box = ask.querySelector('.qc');
    const s = slot(qi);
    s.answer = picked ? picked.textContent.trim() : '';
    s.comment = box ? (box.value||'').trim() : '';
  });
  state.name = (nameInput.value||'').trim();
  state.lead = (leadBox.value||'').trim();
}

function hasContent(){
  return !!(state.name || state.lead ||
    Object.keys(state.answers).some(k=>state.answers[k].answer || state.answers[k].comment));
}

/* Draft autosave: whatever a reader fills in is kept even if they never press
   Submit. Drafts carry submitted:false so a finished response is distinguishable. */
let draftTimer = null;
function queueDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async()=>{
    collect();
    if(!hasContent()) return;
    if(!await dbInit) return;
    const ok = await save();
    if(ok && !state.submitted) setNote(NOTE_DIRTY, true);
  }, 1200);
}

function touched(){
  setStatus(submitSt,'');
  if(dbOK === false) setNote(NOTE_EMAIL, false);
  else if(!state.submitted) setNote(NOTE_DIRTY, true);
  queueDraft();
}

/* Picking an option selects it and keeps a draft; Submit is what completes it. */
document.addEventListener('click', e=>{
  const o = e.target.closest('.opt');
  if(!o) return;
  o.closest('.ask').querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  o.classList.add('on');
  touched();
});
Array.prototype.forEach.call(document.querySelectorAll('.fld'), el=>{
  el.addEventListener('input', touched);
});
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') e.preventDefault(); });

/* The one submit: name, both questions, the written answers and the account note. */
submitBtn.addEventListener('click', async()=>{
  clearTimeout(draftTimer);
  collect();
  if(!hasContent()){
    setStatus(submitSt,'Pick an option or write something before submitting.',true);
    return;
  }
  state.submitted = true;
  state.submittedAt = new Date().toISOString();
  submitBtn.disabled = true;
  setStatus(submitSt,'Submitting…');
  if(!await dbInit){
    state.submitted = false; state.submittedAt = '';
    submitBtn.disabled = false;
    submitByEmail();
    return;
  }
  pending.set(submitSt, state.name
    ? 'Thanks. We have your feedback and the Catalant team may follow up with you.'
    : 'Thanks. We have your feedback and will use it to shape the next issue.');
  const ok = await save();
  submitBtn.disabled = false;
  if(ok){ submitBtn.textContent = 'Update my response'; setNote(NOTE_DONE, false); }
  else { state.submitted = false; state.submittedAt = ''; }
});
</script>

</body></html>
