<!doctype html><html><head><meta charset=utf8><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>The Signal</title><link rel="icon" type="image/png" sizes="180x180" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png"></head><body>
<style>
:root{
  --ink:#0B0838; --ink-2:#2A2748; --ink-3:#514D6E; --ink-4:#7B7794;
  --bg:#FFFFFF; --app-bg:#F3F5F9; --paper:#F7F9FC; --paper-2:#EDF1F7;
  --rule:#DEE3EC; --hair:#EBEFF6;
  --accent:#FA733C; --accent-soft:#FFEEE6; --accent-ink:#9E3F14;
  --blue-900:#0E3F6B; --blue-700:#1B6AAE; --blue:#4AA3E3; --blue-300:#95C9EE; --blue-100:#D4E8F8; --blue-50:#EDF5FC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F4F3F9; --ink-2:#D3D1E4; --ink-3:#A5A2BC; --ink-4:#7B7799;
    --bg:#12103F; --app-bg:#0B0838; --paper:#1A1650; --paper-2:#221D5C;
    --rule:#2E2A6B; --hair:#26215F;
    --accent:#FF8A57; --accent-soft:#3B1F14; --accent-ink:#FFC6AB;
    --blue-900:#B9DBF4; --blue-700:#7FBEEB; --blue:#5EB0E8;
    --blue-300:#3A79AE; --blue-100:#1D3F63; --blue-50:#152C46;
  }
}
*{box-sizing:border-box}
:root[data-theme="dark"]{--ink:#F4F3F9; --ink-2:#D3D1E4; --ink-3:#A5A2BC; --ink-4:#7B7799;--bg:#12103F; --app-bg:#0B0838; --paper:#1A1650; --paper-2:#221D5C;--rule:#2E2A6B; --hair:#26215F;--accent:#FF8A57; --accent-soft:#3B1F14; --accent-ink:#FFC6AB;--blue-900:#B9DBF4; --blue-700:#7FBEEB; --blue:#5EB0E8;--blue-300:#3A79AE; --blue-100:#1D3F63; --blue-50:#152C46}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--app-bg);color:var(--ink);
  font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.tnum{font-variant-numeric:tabular-nums}

.shell{max-width:1200px;margin:0 auto;padding:22px 26px 0;display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
@media(max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:0;padding:16px 18px 0}}
.shell>*{min-width:0}
main{min-width:0;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:30px 38px 40px;margin-bottom:26px}
@media(max-width:760px){main{padding:22px 20px 30px}}

.masthead{position:relative;border-bottom:2px solid var(--blue-900);padding-bottom:14px;margin-bottom:26px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.masthead .mh{font-family:"Newsreader",Georgia,serif;font-size:clamp(32px,4.6vw,46px);font-weight:500;color:var(--ink);letter-spacing:-.025em;line-height:1}
.masthead .dl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--ink-3);text-align:right;line-height:1.7;margin-top:44px}
.masthead .dl b{color:var(--accent);font-weight:700}
.masthead:after{content:"";position:absolute;left:0;bottom:-2px;width:96px;height:2px;background:var(--accent)}
@media(max-width:600px){.masthead .dl{margin-top:48px}}
.fbbtn{position:absolute;top:0;right:0;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:9px 16px;border-radius:6px;
  background:var(--accent);color:#fff;text-decoration:none;box-shadow:0 1px 2px rgba(11,8,56,.12)}
.fbbtn:hover{filter:brightness(.95)}
#feedback{scroll-margin-top:24px}

.toc{border:1px solid var(--rule);border-top:2px solid var(--blue-900);border-radius:7px;background:var(--paper);padding:15px 19px 13px}
.toc .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-bottom:9px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{border-top:1px solid var(--hair)}
.toc li:first-child{border-top:0}
.toc a{display:flex;gap:11px;align-items:baseline;padding:8px 0;text-decoration:none;color:inherit}
.toc .n{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:13px;color:var(--accent);flex:0 0 14px}
.toc .t{font-size:13.5px;font-weight:600;color:var(--ink);flex:0 0 auto}
.toc a:hover .t{color:var(--accent)}
.toc .d{font-family:"Newsreader",Georgia,serif;font-size:14.5px;line-height:1.35;color:var(--ink-3);min-width:0}
@media(max-width:640px){.toc a{flex-wrap:wrap}.toc .t{flex:1 1 0;min-width:0}.toc .d{flex:0 0 100%;padding-left:25px;margin-top:2px}}
#whats-new,#part-essay,.sect{scroll-margin-top:20px}

.news h3{font-family:"Newsreader",Georgia,serif;font-size:clamp(21px,2.7vw,27px);font-weight:500;color:var(--ink);letter-spacing:-.018em;line-height:1.2;max-width:30ch;margin-bottom:14px}
.news p{font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.58;color:var(--ink-2)}
.news p+p{margin-top:12px}
.news p b{color:var(--ink);font-weight:600}
.news p.sub2{margin-top:10px;padding-left:20px;border-left:2px solid var(--hair)}
.news a{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
.news a:hover{color:var(--accent)}
.newsblock+.newsblock{margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}

.part{margin-top:44px}
.parthead{display:flex;align-items:baseline;gap:13px;margin-bottom:16px}
.parthead .num{font-family:"Newsreader",Georgia,serif;font-size:13px;font-style:italic;color:var(--accent);flex:0 0 auto}
.parthead h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.parthead .line{flex:1;height:1px;background:var(--rule)}

.essay h3{font-family:"Newsreader",Georgia,serif;font-size:clamp(25px,3.4vw,34px);font-weight:500;color:var(--ink);letter-spacing:-.02em;line-height:1.18;max-width:22ch;margin-bottom:16px}
.essay p{font-family:"Newsreader",Georgia,serif;font-size:18.5px;line-height:1.6;color:var(--ink-2);max-width:none}
.essay p + p{margin-top:14px}
.essay em{font-style:italic;color:var(--ink)}
.sign{margin-top:20px;padding-top:12px;border-top:2px solid var(--accent);display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

.sect{margin-top:34px;padding-top:2px}
.secthead{display:flex;align-items:baseline;gap:12px;margin-bottom:11px;flex-wrap:wrap}
.secthead h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--blue-700);display:flex;align-items:center;gap:8px}
.secthead h3:before{content:"";width:9px;height:9px;background:var(--accent);border-radius:2px;flex:0 0 auto}
.secthead .r{flex:1;height:1px;background:var(--blue-700);opacity:.3;min-width:20px}
.analysis{font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.58;color:var(--ink-2);max-width:none}

.ex{margin-top:18px;border:1px solid var(--rule);border-top:2px solid var(--accent);border-radius:7px;background:var(--bg);overflow:hidden}
.exh{padding:13px 18px 12px;border-bottom:1px solid var(--hair);background:var(--paper);display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.exh h4{font-size:14.5px;font-weight:600;letter-spacing:-.008em}
.exh .unit{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--ink-4)}
.exb{padding:16px 18px 18px}
.freq{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.reads{margin-top:13px;font-size:13.5px;line-height:1.55;color:var(--ink-2);border-left:3px solid var(--blue-700);background:var(--blue-50);padding:11px 13px;border-radius:0 5px 5px 0}
.reads b{color:var(--ink);font-weight:600}
.sowhat{margin-top:11px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--accent-ink)}
.sowhat .lbl{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:6px}

.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:460px;height:auto}
.axl{font-size:9.5px;fill:var(--ink-4);font-weight:500;font-family:"Libre Franklin",sans-serif}
.gl{stroke:var(--hair);stroke-width:1}
.gz{stroke:var(--rule);stroke-width:1.4}
.endl{font-size:10.5px;font-weight:700;font-family:"Libre Franklin",sans-serif}

.rk{display:flex;flex-direction:column}
.rkrow{display:grid;grid-template-columns:1fr 46px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair)}
.rkrow:last-child{border-bottom:0}
.rkrow .lab{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:10px;min-width:0}
.rkrow .lab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkrow .bar{height:8px;border-radius:2px;flex:0 0 auto}
.rkrow .v{text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

.qs{display:flex;flex-direction:column;gap:11px}
.q{font-family:"Newsreader",Georgia,serif;font-size:15.5px;font-style:italic;line-height:1.5;color:var(--ink-2);padding:12px 15px;background:var(--blue-50);border-left:3px solid var(--blue-300);border-radius:0 5px 5px 0}
.q cite{display:block;font-family:"Libre Franklin",sans-serif;font-style:normal;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);margin-top:8px;font-weight:700}

.ask{border:1px solid var(--rule);border-radius:7px;padding:22px;background:var(--paper)}
.ask h4{font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:400;line-height:1.3;max-width:36ch;margin-bottom:8px}
.ask .sub{font-size:13.5px;color:var(--ink-3);line-height:1.55;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:15px}
.opt{text-align:left;border:1px solid var(--rule);border-radius:4px;padding:11px 14px;font-size:13.5px;color:var(--ink-2);transition:.14s}
.opt:hover{border-color:var(--blue-700);background:var(--blue-50)}
.opt.on{border-color:var(--blue-700);background:var(--blue-50);color:var(--blue-900);font-weight:600}
.thanks{margin-top:11px;font-size:12.5px;color:var(--blue-700);font-weight:600}
.thanks.err{color:var(--accent-ink)}
.namerow{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:0 0 20px}
.namerow label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.namerow .thanks{margin-top:0}
.submitbar{margin-top:24px;padding:19px 21px;border:1px solid var(--accent);border-left:3px solid var(--accent);border-radius:7px;
  background:var(--accent-soft);display:flex;align-items:center;gap:17px;flex-wrap:wrap}
.submitbar .cta{margin-top:0;padding:13px 30px;font-size:14.5px;box-shadow:0 1px 3px rgba(11,8,56,.18);flex:0 0 auto}
.submitbar .thanks{margin-top:0}
.subnote{font-size:12.5px;line-height:1.5;color:var(--accent-ink);font-weight:600;min-width:0}
.fld{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;width:100%;max-width:340px;flex:1 1 210px;min-width:0}
.fld::placeholder{color:var(--ink-4)}
.fld:focus{border-color:var(--blue-700);outline:none;box-shadow:0 0 0 3px var(--blue-50)}
textarea.fld{display:block;max-width:none;min-height:78px;resize:vertical;line-height:1.5;margin-top:15px}
.cta[disabled]{opacity:.55;cursor:default}
.ask.partner{margin-top:16px;border-color:var(--accent);border-left:3px solid var(--accent);background:var(--accent-soft)}
.ask.partner h4{color:var(--accent-ink)}
.ask.partner .sub{color:var(--accent-ink);opacity:.92}
.cta{margin-top:14px;background:var(--accent);color:#fff;border-radius:5px;padding:10px 18px;font-size:13.5px;font-weight:600}
.cta:hover{filter:brightness(1.06)}

footer{border-top:1px solid var(--rule);margin-top:44px;padding-top:20px;font-size:12px;color:var(--ink-3);line-height:1.65;max-width:none}
footer b{color:var(--ink-2);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.fade{animation:fi .28s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- rail (archive) ---------- */
.rail{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;
  background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:18px 16px 16px}
@media(max-width:960px){.rail{position:static;max-height:none;overflow:visible;margin-bottom:16px}}
.railtitle{font-family:"Newsreader",Georgia,serif;font-size:23px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin-bottom:3px;color:var(--ink)}
.railsub{font-size:11px;color:var(--ink-3);line-height:1.45;margin-bottom:18px}
.railhead{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);
  padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.issues{display:flex;flex-direction:column}
@media(max-width:960px){.issues{flex-direction:row;gap:9px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}.railtitle{font-size:30px}}
.iss{text-align:left;padding:12px 12px 12px 13px;border-left:2px solid transparent;border-radius:0 6px 6px 0;
  display:flex;flex-direction:column;gap:3px;transition:background .15s,border-color .15s}
.iss:hover{background:var(--paper)}
.iss .n{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-4)}
.iss .d{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.iss .t{font-family:"Newsreader",Georgia,serif;font-size:13px;font-style:italic;color:var(--ink-3);line-height:1.35}
.iss[aria-current="true"]{border-left-color:var(--accent);background:var(--blue-50)}
.iss[aria-current="true"] .n{color:var(--accent-ink)}
.iss[aria-current="true"] .d{color:var(--ink)}
@media(max-width:960px){.iss{flex:0 0 200px;border-left:0;border-top:2px solid transparent;border-radius:0 0 6px 6px;background:var(--paper)}.iss[aria-current="true"]{border-top-color:var(--accent)}}
.raillegend{margin-top:24px;padding-top:16px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--ink-4);line-height:1.5}
@media(max-width:960px){.raillegend{display:none}}

/* ---------- pager ---------- */
.pager{margin-top:48px;padding-top:18px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:14px}
.pg{font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;text-align:left}
.pg:hover{color:var(--blue-700)}
.pg .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-4)}
.pg.n{text-align:right;align-items:flex-end}

/* ---------- new exhibit types ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.strow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.strow .lab{font-size:12px;font-weight:600;color:var(--ink-2)}
.stbar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--paper-2)}
.stbar i{font-style:normal;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

table.mom{width:100%;border-collapse:collapse;font-size:13px}
table.mom th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);font-weight:700;text-align:right;padding:0 8px 8px;border-bottom:1px solid var(--rule)}
table.mom th:first-child,table.mom td:first-child{text-align:left;padding-left:0}
table.mom td{padding:9px 8px;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
table.mom tr:last-child td{border-bottom:0}
table.mom td.name{font-weight:600;color:var(--ink)}
table.mom td.who{font-size:11.5px;color:var(--ink-3);text-align:left}
.up{color:var(--accent);font-weight:700}.dn{color:var(--blue-700);font-weight:700}.fl{color:var(--ink-4)}
.momwrap{overflow-x:auto}

.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.two h5{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}

.stages{display:flex;flex-direction:column;gap:22px}
.stg .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.stg .hd b{font-size:13.5px;color:var(--ink)}
.stg .hd span{font-size:12px;color:var(--ink-3)}
.stg .hd span b{font-size:15px;color:var(--accent)}
.track{display:flex;height:34px;border-radius:5px;overflow:hidden;background:var(--paper-2);position:relative}
.track i{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.15;color:#fff;font-weight:700;border-right:1px solid rgba(255,255,255,.35);overflow:hidden;white-space:nowrap}
.track i small{font-weight:500;opacity:.9;font-size:9px}
.track .rest{color:var(--ink-3);background:repeating-linear-gradient(135deg,var(--paper-2) 0 6px,var(--hair) 6px 12px);border-right:0}
.stgnote{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-style:italic}
.stgnote b{font-style:normal;color:var(--accent-ink)}
.stgkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--ink-3)}
.stgkey span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.dot3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){.dot3{grid-template-columns:1fr}}
.dbox{border:1px solid var(--rule);border-radius:6px;padding:14px 15px;background:var(--paper)}
.dbox h5{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:10px}
.drow{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;color:var(--ink-2)}
.drow .bar{height:7px;border-radius:2px;background:var(--blue-300)}
.drow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.drow.hot .bar{background:var(--accent)}.drow.hot .v{color:var(--accent)}

.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center}
@media(max-width:560px){.frow{grid-template-columns:110px 1fr 60px}}
.frow .lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.frow .fb{height:22px;border-radius:3px;background:var(--blue-300)}
.frow.hot .fb{background:var(--accent)}
.frow .v{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.frow.hot .v{color:var(--accent)}
.frow .sub{display:block;font-size:10.5px;color:var(--ink-4);font-weight:500}

.nextb{border:1px solid var(--accent);border-left-width:3px;background:var(--accent-soft);border-radius:7px;padding:18px 20px}

  essay:{
    h:'We&rsquo;re getting out of the business of making you compete.',
    ps:[
      'Two years ago, roughly one in three engagements on Catalant started with us bringing a single consultant to a client. So far this quarter it&rsquo;s two in three. Nobody announced that shift. It happened one Client Partner at a time, because it just works better for everyone involved. The client gets one person who has clearly been chosen for them, that person gets a real conversation instead of a pitch, and the whole thing closes in days rather than weeks. The auction was how we got started. The invitation is how we&rsquo;re going to grow.',

    { k:'Demand trends', id:'sec-demand',
      analysis:'We heard from you that you&rsquo;d like to know more about which industries and buyer types are most active right now, so we built this section to answer them. The headline is that the buyer has moved: away from corporate strategy and the executive suite, toward private equity portfolio teams and the line functions that have to live with the result. Who the buyer is, their function and level, shapes the brief far more than the industry does. It also shapes whether the brief turns into an engagement at all. If you usually think about your positioning by industry, try to instead think about it by who owns the problem and what they need to hear.',

         rows:[['2024',[10.8,19.4,21.9,27.7,20.1]],['2025',[16.9,19.0,18.4,25.8,19.9]],['2026 to date',[17.4,22.1,17.9,21.8,20.8]],['Last 90 days',[17.0,24.8,13.1,24.8,20.2]]],
         reads:'<b>Read it as:</b> the C-suite share of briefs has risen from roughly one in nine in 2024 to one in six this year, and investors, partners, principals and associates at PE firms, are now the single largest level, a quarter of briefs in the last 90 days. The middle, VPs and SVPs, is where the share has come out. A brief owned by a director or a manager converts to an engagement at roughly twice the rate of one owned by a C-suite executive or an investor, because the director already has a mandate and a budget line, while the executive is often still deciding whether to do the work at all.',
         sowhat:'Match your altitude to the buyer&rsquo;s. With a C-suite or investor buyer, the first conversation is discovery, not a pitch: help them decide what the work is, and expect to be introduced to the person who will own it. With a director-level buyer, the decision is largely made; be concrete about the plan for month one and let them see you&rsquo;re easy to work with.'},

         reads:'<b>Read it as:</b> private equity buys the deal cycle. Diligence, value creation plans, market sizing before or just after a transaction, then integration and carve-out when the portfolio moves. Enterprise buys execution: integration, process improvement and change management make up nearly three in ten enterprise briefs. The one category moving fastest across both is <b>integration</b>, which is running at more than five times last year&rsquo;s pace, a direct read on the deal activity that has come back this year. <b>One thing to know:</b> we only classify project type on briefs that get far enough to be typed, roughly four in ten, so again, shape not census.',

    { k:'Buyer decision trends', id:'sec-buyer',
      analysis:'The most requested insights were how long it takes to win and what slows it down. The honest answer starts with how clients are choosing. Two years ago most engagements were won out of a shortlist of four or more consultants; now most are won by a consultant handpicked by our team to meet with the client. Where deals still drag, the time isn&rsquo;t spent in the steps you can see. It&rsquo;s spent while the client decides and while the proposal is being iterated on. That&rsquo;s the part you can change, and it&rsquo;s exactly what One Team is designed to fix.',

         rows:[['2024 H1',[33.5,5.7,60.9]],['2024 H2',[30.4,15.1,54.6]],['2025 H1',[36.9,20.0,43.1]],['2025 H2',[50.6,16.3,33.1]],['2026 to date',[53.7,20.0,26.3]]],
         reads:'<b>Read it as:</b> two years ago, three in five engagements were won after the client compared four or more consultants. So far in 2026 it&rsquo;s one in four, and more than half of what we win now goes to a consultant the client met on their own, with nobody else in the frame. The average number of consultants shown per won engagement has fallen from 4.2 to 2.6. Across all closed-won work the median from brief to contract is 12.6 days this year, down from 14.0 in each of the last two years, and the step we own, approval to signed contract, has fallen from 4.2 days in 2024 to 1.0 as more accounts contract directly with Catalant. <b>One thing to know:</b> when we bring a consultant in before the brief is written, the platform only sees the tail end of the conversation, so the one-consultant share is a floor, not a ceiling.',
         sowhat:'The competitive pitch is becoming the exception. That changes what winning means. It&rsquo;s less about standing out in a shortlist and more about being the person a Client Partner brings to a specific problem, then helping them get to one proposal that lands. The next chart shows where the time goes when it doesn&rsquo;t.'},
        {type:'dot3',title:'What slows it down: days to contract by how the winning consultant&rsquo;s proposal went',unit:'Median days from brief to contract, closed-won work since July 2025, counting only the proposal activity of the consultant who won',
         boxes:[
           {h:'Proposals the winner submitted',rows:[['One proposal',11.3,false],['Two or more',21.0,true]]},
           {h:'Revisions after submitting',rows:[['No revisions',7.2,false],['One or two',16.1,false],['Three or more',29.0,true]]},
           {h:'Client meetings logged on the brief',rows:[['One meeting',15.3,false],['Two or three',21.1,false],['Four or more',31.0,true]]}],
         reads:'<b>Read it as:</b> this is about your own proposal, not anyone else&rsquo;s. In about three in four wins the consultant who won was the only one who submitted a proposal at all. When that consultant got it right the first time, the work went from brief to contract in a median of 11.3 days, and with no revisions after sending, 7.2. A second proposal from the same consultant pushed the median to 21.0 days, and three or more rounds of revisions to 29.0. Meetings tell the same story: four or more client meetings before a contract usually means the problem was never fully diagnosed. It&rsquo;s not a sign of diligence. Enterprise briefs run slowest, and are the most likely to need a second pass.',
         sowhat:'Second proposals are almost never about price. They happen when the first one answered a question the client didn&rsquo;t ask: the wrong scope, the wrong altitude, a workplan before the problem was agreed. The fix is upstream, in discovery, and it&rsquo;s a shared job. The One Team model puts the substance of the diagnosis and the scope on you, and the process, the relationship and the commercial conversation on your Client Partner. When both halves are done before anyone starts writing, you get one proposal.'},
        {type:'coach',title:'How to partner with Catalant to close faster: the One Team version',unit:'From the One Team sessions, applied to this data',
         h:'Five things that shorten the clock',
         items:[
           '<b>Get in before the proposal, not after it.</b> The rule of thumb from Session 1 was simple: when in doubt, the consultant comes in earlier. The data agrees. The deals that close on one proposal are the ones where the person doing the work was in the discovery conversation.',
           '<b>Prep together before every client call.</b> Fifteen to twenty minutes with your Client Partner on who we&rsquo;re walking in with, what we&rsquo;re walking into and how we want the conversation to go. It&rsquo;s the single cheapest thing on this list and it&rsquo;s why an invited engagement rarely needs a second meeting.',
           '<b>Own the diagnosis and the scope; let your Client Partner own the price.</b> You define what is in, what is out, and the end products. They read the relationship and decide when the client is ready to see a number. One client-facing price, no build-up, no hours shown.',
           '<b>Lead the proposal with their situation, not your credentials.</b> Context before capabilities, and outcome-forward proof: quantified results from comparable work, not activity lists. That&rsquo;s what turns a first proposal into the only proposal.',

    { k:'Supply trends', id:'sec-supply',
      analysis:'We heard from you that you&rsquo;d like to know how many people are competing on a typical project. The short answer is that on an openly posted brief it is a crowded room, and it has gotten more crowded as the network has grown, up to over 25 consultants on a project posted to the marketplace. The better answer is that it matters less every quarter. That&rsquo;s precisely why we&rsquo;re moving away from posting as the default and toward pulling the right consultant in early, as a partner rather than a bidder. And you can see in the numbers that we&rsquo;ve tipped the scale toward this new model. It&rsquo;s already how most of the work we win gets done.',

         reads:'<b>Read it as:</b> in early 2024, fewer than one in three briefs the team worked put a handpicked shortlist of three or fewer consultants in front of the client; the rest ran as an open field of four or more. So far this quarter it&rsquo;s nearly three in four, and 84.1% of what we&rsquo;ve won came that way. Within the handpicked group the single-consultant invitation is the fastest-growing piece, now 40.9% of worked briefs and 66.4% of wins, up from roughly one in five and one in three. The average number of consultants the client sees before choosing has fallen from 4.4 to 2.0. <b>One thing to know:</b> the quarter isn&rsquo;t over and open-field briefs take longer to resolve, so the Q3 numbers will settle a bit lower. The direction won&rsquo;t change.',
         sowhat:'Getting handpicked is about relationships, not an algorithm. Client Partners bring in people they have worked with, prepped with, and seen deliver. The One Team sessions, the Connect events and the joint planning work are how you become that person for two or three Client Partners in your area. If you&rsquo;re not yet working with one, tell us in the feedback section below which industries and buyer types you want to be pulled into, and we&rsquo;ll make the introduction.'}

      'While investments in AI continue to skyrocket, many organizations are discovering that building AI tools is significantly easier than getting teams to use them effectively. To solve this disconnect, we have announced the launch of Forward Deployed Experts (FDX), a new service offering aimed directly at bridging the gap between high-level AI strategy and bottom-line business value.',

const ISSUES = [ISSUE2, ISSUE1];
ISSUE1.short = 'Quality and reliability, without the rest of it';

/* ============================================================ RENDER */
const $ = s => document.querySelector(s);
const pct = v => Number(v).toFixed(1);
const usd = v => '$' + Number(v).toLocaleString('en-US');
const num = v => (typeof v==='number' ? v.toLocaleString('en-US') : v);

function svgGap(b){
  const W=760,H=310,L=44,R=150,T=16,B=42, ymax=60;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=15){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  const top=b.said.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const bot=b.bought.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
  g+=`<polygon points="${top} ${bot}" fill="var(--accent)" opacity="0.13"/>`;
  b.x.forEach((q,i)=>{
    const gap=pct(b.said[i]-b.bought[i]);
    const my=(y(b.said[i])+y(b.bought[i]))/2;
    g+=`<text class="endl" x="${x(i)}" y="${my+3.5}" text-anchor="middle" fill="var(--accent-ink)" font-size="10.5">${gap} pts</text>`;
  });
  const line=(d,c,w)=>{
    let o=`<polyline points="${d.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    d.forEach((v,i)=>{ o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="${c}"/>`; });
    return o;
  };
  g+=line(b.said,'var(--accent)',2.6);
  g+=line(b.bought,'var(--blue-900)',2.6);
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.said[n-1])+3.5}" fill="var(--accent)">${pct(b.said[n-1])}% <tspan font-weight="500" font-size="9.5">of client conversations</tspan></text>`;
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.bought[n-1])+3.5}" fill="var(--blue-900)">${pct(b.bought[n-1])}% <tspan font-weight="500" font-size="9.5">of project briefs</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function svgLine(b){
  const W=760,H=300,L=44,R=170,T=22,B=42, ymax=b.ymax||70;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=10){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  g+=`<polyline points="${b.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  b.vals.forEach((v,i)=>{
    const last = b.openLast && i===n-1;
    g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.2" fill="${last?'var(--paper)':'var(--accent)'}" stroke="var(--accent)" stroke-width="2.2"/>`;
    g+=`<text class="endl" x="${x(i)}" y="${y(v)-10}" text-anchor="middle" fill="var(--accent-ink)" font-size="11">${pct(v)}</text>`;
  });
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.vals[n-1])+3.5}" fill="var(--accent)">${pct(b.vals[n-1])}% <tspan font-weight="500" font-size="9.5">${b.endLabel||''}</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function svgShift(b){
  const W=760,H=300,L=44,R=170,T=16,B=42, ymax=b.ymax||70;
  const iw=W-L-R, ih=H-T-B, n=b.x.length;
  const x=i=>L+iw*i/(n-1), y=v=>T+ih-ih*v/ymax;
  let g='';
  for(let v=0;v<=ymax;v+=10){
    g+=`<line class="${v===0?'gz':'gl'}" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g+=`<text class="axl" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  }
  b.x.forEach((q,i)=>{ g+=`<text class="axl" x="${x(i)}" y="${H-22}" text-anchor="middle">${q}</text>`; });
  const top=b.wins.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const bot=b.briefs.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
  g+=`<polygon points="${top} ${bot}" fill="var(--accent)" opacity="0.10"/>`;
  const line=(d,c,w,dash)=>{
    let o=`<polyline points="${d.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    d.forEach((v,i)=>{ o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="${c}"/>`; });
    return o;
  };
  g+=line(b.briefs,'var(--blue-900)',2.4);
  g+=line(b.wins,'var(--accent)',2.6);
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.wins[n-1])+3.5}" fill="var(--accent)">${pct(b.wins[n-1])}% <tspan font-weight="500" font-size="9.5">${b.winsLabel||'of engagements won'}</tspan></text>`;
  g+=`<text class="endl" x="${W-R+11}" y="${y(b.briefs[n-1])+3.5}" fill="var(--blue-900)">${pct(b.briefs[n-1])}% <tspan font-weight="500" font-size="9.5">${b.briefsLabel||'of new briefs'}</tspan></text>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.title}">${g}</svg></div>`;
}

function dist(b){
  const mx=Math.max(...b.rows.map(r=>r[1]));
  return `<div class="rk">`+b.rows.map(([lab,v,hot])=>
    `<div class="rkrow" style="grid-template-columns:1fr 58px">
       <div class="lab"><i class="bar" style="width:${Math.max(4,v/mx*180)}px;background:${hot?'var(--accent)':'var(--blue-300)'}"></i><span style="${hot?'font-weight:600':''}">${lab}</span></div>
       <div class="v tnum" style="color:${hot?'var(--accent)':'var(--ink-3)'}">${pct(v)}%</div></div>`).join('')+`</div>`;
}

function rank(b){
  const mx=Math.max(...b.rows.map(r=>r[1]));
  const fmt = b.fmt==='usd' ? usd : num;
  const wide = b.fmt==='usd' ? ' style="grid-template-columns:1fr 78px"' : '';
  return `<div class="rk">`+b.rows.map(([n,v,c])=>
    `<div class="rkrow"${wide}><div class="lab"><i class="bar" style="width:${Math.max(6,v/mx*140)}px;background:${c}"></i><span>${n}</span></div>
     <div class="v tnum" style="color:${c==='var(--accent)'?'var(--accent)':'var(--ink-2)'}">${fmt(v)}</div></div>`).join('')+`</div>`;
}

function quotes(b){
  return `<div class="qs">`+b.qs.map(([t,c])=>`<div class="q">&ldquo;${t}&rdquo;<cite>${c}</cite></div>`).join('')+`</div>`;
}

function stack(b){
  return `<div class="stack">`+b.rows.map(([lab,vals])=>
    `<div class="strow"><div class="lab">${lab}</div><div class="stbar">`+
    vals.map((v,i)=>`<i style="width:${v}%;background:${b.cats[i][1]}" title="${b.cats[i][0]}: ${pct(v)}%">${v>=9?pct(v)+'%':''}</i>`).join('')+
    `</div></div>`).join('')+`</div><div class="legend">`+b.cats.map(([n,c])=>`<span style="--c:${c}">${n}</span>`).join('')+`</div>`;
}

function mom(b){
  const arrow=(a,c)=>{ const d=Math.round((c-a)*10)/10; if(d===0) return `<span class="fl">0.0</span>`; return d>0?`<span class="up">&#9650; ${pct(d)}</span>`:`<span class="dn">&#9660; ${pct(-d)}</span>`; };
  return `<div class="momwrap"><table class="mom"><thead><tr><th>${b.first||'Industry'}</th><th>${(b.cols||['2025','2026 to date','Last 90 days'])[0]}</th><th>${(b.cols||['2025','2026 to date','Last 90 days'])[1]}</th><th>${(b.cols||['2025','2026 to date','Last 90 days'])[2]}</th><th>Move</th><th style="text-align:left">${b.last||'Who is buying'}</th></tr></thead><tbody>`+
    b.rows.map(([n,a,c,d,who])=>`<tr><td class="name">${n}</td><td>${pct(a)}%</td><td>${pct(c)}%</td><td>${pct(d)}%</td><td>${arrow(a,d)}</td><td class="who">${who}</td></tr>`).join('')+
    `</tbody></table></div>`;
}

function two(b){
  const col=(c,hot)=>{ const mx=Math.max(...c.rows.map(r=>r[1]));
    return `<div><h5>${c.h}</h5><div class="rk">`+c.rows.map(([n,v])=>`<div class="rkrow" style="grid-template-columns:1fr 50px"><div class="lab"><i class="bar" style="width:${Math.max(6,v/mx*110)}px;background:${hot}"></i><span>${n}</span></div><div class="v tnum">${pct(v)}%</div></div>`).join('')+`</div></div>`; };
  return `<div class="two">${col(b.left,'var(--accent)')}${col(b.right,'var(--blue-900)')}</div>`;
}

function stages(b){
  const max=Math.max(...b.rows.map(r=>r.total));
  return `<div class="stages">`+b.rows.map(r=>{
    const shown=r.segs.reduce((a,c)=>a+c,0);
    const rest=Math.max(0,r.total-shown);
    let segs=r.segs.map((v,i)=>v>0?`<i style="width:${v/max*100}%;background:${b.key[i][1]}" title="${b.key[i][0]}: ${pct(v)} days">${v/max>0.07?`<span>${pct(v)}<small> d</small></span>`:''}</i>`:'').join('');
    if(rest>0) segs+=`<i class="rest" style="width:${rest/max*100}%" title="${r.rest}">${rest/max>0.15?`<span>${pct(rest)} days between steps</span>`:''}</i>`;
    return `<div class="stg"><div class="hd"><b>${r.lab}</b><span>median <b>${pct(r.total)}</b> days brief to contract</span></div><div class="track">${segs}</div><div class="stgnote">${r.total/max<0.2?`<b>${pct(r.total)} days end to end.</b> `:''}${r.rest}</div></div>`;
  }).join('')+`</div><div class="stgkey">`+b.key.map(([n,c])=>`<span style="--c:${c}">${n}</span>`).join('')+`<span style="--c:var(--hair)">Time between steps</span></div>`;
}

function dot3(b){
  return `<div class="dot3">`+b.boxes.map(bx=>{ const mx=Math.max(...bx.rows.map(r=>r[1]));
    return `<div class="dbox"><h5>${bx.h}</h5>`+bx.rows.map(([n,v,hot])=>`<div class="drow${hot?' hot':''}"><div><div style="margin-bottom:4px">${n}</div><div class="bar" style="width:${v/mx*100}%"></div></div><div class="v">${pct(v)}</div></div>`).join('')+`</div>`; }).join('')+`</div>`;
}

function funnel(b){
  const mx=b.rows[0][1];
  return `<div class="funnel">`+b.rows.map(([n,v,sub,hot])=>`<div class="frow${hot?' hot':''}"><div class="lab">${n}${sub?`<span class="sub">${sub}</span>`:''}</div><div><div class="fb" style="width:${Math.max(1.2,v/mx*100)}%"></div></div><div class="v">${hot?'1':'~'+num(v)}</div></div>`).join('')+`</div>`;
}

function coach(b){
  return `<div class="coach"><div class="ch">${b.h}</div><ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol></div>`;
}

function renderBlock(b){
  let body='';
  if(b.type==='gap') body=svgGap(b);
  else if(b.type==='shift') body=svgShift(b);
  else if(b.type==='line') body=svgLine(b);
  else if(b.type==='rank') body=rank(b);
  else if(b.type==='quotes') body=quotes(b);
  else if(b.type==='dist') body=dist(b);
  else if(b.type==='stack') body=stack(b);
  else if(b.type==='mom') body=mom(b);
  else if(b.type==='two') body=two(b);
  else if(b.type==='stages') body=stages(b);
  else if(b.type==='dot3') body=dot3(b);
  else if(b.type==='funnel') body=funnel(b);
  else if(b.type==='coach') body=coach(b);
  const unit = b.unit ? `<div class="unit">${b.unit}</div>` : '';
  return `<div class="ex">
    <div class="exh"><h4>${b.title}</h4>${unit}</div>
    <div class="exb">${body}${b.reads?`<div class="reads">${b.reads}</div>`:''}${b.sowhat?`<div class="sowhat"><span class="lbl">So what</span>${b.sowhat}</div>`:''}</div>
  </div>`;
}

function partHead(num,label){
  return `<div class="parthead"><span class="num">${num}</span><h2>${label}</h2><span class="line"></span></div>`;
}

const WORDS=['One','Two','Three','Four','Five'];

function renderIssue(idx){
  const s=ISSUES[idx];
  let p=0;
  let h = `<div class="masthead">
      <a class="fbbtn" href="#feedback">Feedback</a>
      <div class="mh">The Signal</div>
      <div class="dl">No. ${s.no}<br>${s.date}${s.tag?`<br><b>${s.tag}</b>`:''}</div>
    </div>`;

  if(s.toc && s.toc.length){
    h += `<nav class="toc" aria-label="In this issue">
      <div class="lbl">In this issue</div>
      <ol>${s.toc.map((it,i)=>`<li><a href="${it.href}"><span class="n">${i+1}</span><span class="t">${it.t}</span><span class="d">${it.d}</span></a></li>`).join('')}</ol>
    </nav>`;
  }

  if(s.news){
    h += `<section class="part" id="whats-new">${partHead(WORDS[p++],s.news.label||'What&rsquo;s new at Catalant')}
      <div class="news">${s.news.blocks.map(b=>`<div class="newsblock"><h3>${b.h}</h3>
        ${b.ps.map(pp=> typeof pp === 'string'
            ? `<p>${pp}</p>`
            : `<p>${pp.t}</p>${pp.sub.map(x=>`<p class="sub2">${x}</p>`).join('')}`).join('')}
      </div>`).join('')}</div></section>`;
  }

  h += `<section class="part" id="part-essay">${partHead(WORDS[p++],s.essayLabel||'What we are seeing: Reflections from Pat')}
    <div class="essay"><h3>${s.essay.h}</h3>${s.essay.ps.map(pp=>`<p>${pp}</p>`).join('')}
    <div class="sign">Pat Petitti</div></div></section>`;

  h += `<section class="part">${partHead(WORDS[p++],'The data')}`;
  s.sections.forEach(sec=>{
    h += `<div class="sect"${sec.id?` id="${sec.id}"`:''}><div class="secthead"><h3>${sec.k}</h3><span class="r"></span></div>
      <p class="analysis">${sec.analysis}</p>
      ${sec.blocks.map(renderBlock).join('')}</div>`;
  });
  h += `</section>`;

  h += `<section class="part" id="feedback">${partHead(WORDS[p++],'Feedback and questions')}
    <p class="analysis" style="margin-bottom:18px;max-width:none">We want your feedback on how we can support you, and we&rsquo;re always looking for insights from you. Share your name if you&rsquo;re open to someone from the Catalant team following up. Answer whatever is useful, then hit <b>Submit feedback</b> at the end.</p>
    <div class="namerow">
      <label for="fbname">Your name</label>
      <input class="fld" id="fbname" type="text" autocomplete="name" placeholder="Optional, only if you are open to a follow-up">
    </div>
    ${s.asks.map((a,ai)=>`<div class="ask" style="${ai>0?'margin-top:16px':''}"><h4>${a.q}</h4><p class="sub">${a.sub}</p>
      ${a.opts&&a.opts.length?`<div class="opts">${a.opts.map((o,n)=>`<button class="opt" data-o="${n}">${o}</button>`).join('')}</div>`:''}
      <textarea class="fld qc" id="qc${ai}" data-q="${ai}" rows="3" placeholder="${a.opts&&a.opts.length?'In your own words &mdash; anything you want to add':'Your answer, in your own words'}"></textarea>
    </div>`).join('')}
    <div class="ask partner">
      <h4>Are there accounts or clients where you have relationships and want to partner with Catalant?</h4>
      <p class="sub">If you know someone at a company we should be talking to, tell us and we will build the approach with you rather than around you. This is how a meaningful share of our best engagements start, and it is exactly the invited path described above.</p>
      <textarea class="fld" id="leadbox" rows="3" placeholder="The company or account, and anything useful about the relationship"></textarea>
    </div>
    <div class="submitbar">
      <button class="cta" id="submitall">Submit feedback</button>
      <p class="subnote" id="submitnote">Press Submit when you are done.</p>
      <p class="thanks" id="submitstatus" hidden></p>
    </div></section>`;

  if(s.next){
    h += `<section class="part" id="next">${partHead(WORDS[p++],s.nextLabel||'What is coming next')}
      <div class="nextb"><p style="font-size:13px;color:var(--ink-3)">In the next issue</p>
      <ul>${s.next.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`;
  }

  const older = ISSUES[idx+1], newer = ISSUES[idx-1];
  h += `<div class="pager">
    ${older?`<button class="pg" data-go="${idx+1}"><span class="k">Previous issue</span>No. ${older.no} &middot; ${older.short}</button>`:'<span></span>'}
    ${newer?`<button class="pg n" data-go="${idx-1}"><span class="k">Next issue</span>No. ${newer.no} &middot; ${newer.short}</button>`:'<span></span>'}
  </div>`;

  h += `<footer><p><b>How to read the numbers.</b> Everything about client demand is shown as a share, a direction or a rank, never as a count, a client name or a deal value. Our clients tell us things on the condition that we do not repeat them. Supply-side figures such as rates and practice area pool sizes are our own network&rsquo;s data and are shown directly.</p>
    <p style="margin-top:9px"><b>Where it comes from.</b> The Signal is written from the project briefs submitted to Catalant, the activity on the platform around them, and the client conversations our team records, read in full. Nothing in it identifies a client, a company or a transaction. Sales cycle is measured from the brief being created to a contract being created, on closed-won work only, and compared across the period in which the work closed. A private equity brief means the buying account sits in one of our PE client communities. Industry and project type are classified on briefs that progressed to a conversation. Internal and test records are excluded from every denominator.</p></footer>`;

  return h;
}

/* ============================================================ RAIL + NAV */
let cur = 0;
$('#issues').innerHTML = ISSUES.map((s,i)=>
  `<button class="iss" data-go="${i}" aria-current="${i===0}">
     <span class="n">No. ${s.no}${i===0?' &middot; Current':''} &middot; ${s.date.replace(/^\w+ /,'')}</span>
     <span class="d">${s.short}</span>
     <span class="t">${s.hook}</span>
   </button>`).join('');

function show(i){
  cur = i;
  const m = $('#main');
  try { m.innerHTML = renderIssue(i); }
  catch(err){ m.innerHTML = '<div style="padding:40px 0"><p style="font-size:15px;color:var(--ink-2)">This issue could not be rendered. '+String(err && err.message||err)+'</p></div>'; }
  m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  Array.prototype.forEach.call($('#issues').children,(b,n)=>b.setAttribute('aria-current', n===i));
  try{ history.replaceState(null,'','#issue-'+ISSUES[i].no); }catch(_){}
  window.scrollTo({top:0,behavior:'auto'});
  bindFeedback();
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){ show(+g.dataset.go); return; }
});

/* ============================================================ FEEDBACK */
/* One record per reader per issue. Saved to the artifact's own store when this
   page runs inside claude.ai; otherwise Submit opens an email with the answers. */
const EMAIL = 'aewing@gocatalant.com';

/* Google Form behind the page. Off claude.ai there is no artifact store, so
   Submit posts here and responses collect as rows in one sheet. Field ids
   come from the form's pre-filled link; the reader never loads Google.
   Google sends no CORS headers on formResponse, so the post is opaque: a
   resolved fetch means the request left the browser, not that Google took it. */
const GFORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdrPdi5jalWdQhF_9-0bHFRgbubGdnxXcHEQ4U5PB0i5HcE5A/formResponse';
const GFIELD = {
  name: 'entry.1336297382',
  q1a:  'entry.1892784339', q1c: 'entry.994278215',
  q2a:  'entry.1875937243', q2c: 'entry.283640038',
  q3c:  'entry.771702245',
  lead: 'entry.944085083'
};

/* Issue 1 asks two questions and issue 2 asks three, so q3 is simply empty
   when the reader is on the older issue. */
function postToForm(state){
  const a = n => state.answers['q' + n] || {};
  const p = new URLSearchParams();
  p.append(GFIELD.name, state.name);
  p.append(GFIELD.q1a, a(1).answer  || '');
  p.append(GFIELD.q1c, a(1).comment || '');
  p.append(GFIELD.q2a, a(2).answer  || '');
  p.append(GFIELD.q2c, a(2).comment || '');
  p.append(GFIELD.q3c, a(3).comment || '');
  p.append(GFIELD.lead, state.lead);
  return fetch(GFORM, { method:'POST', mode:'no-cors', body:p })
    .then(function(){ return true; })
    .catch(function(){ return false; });
}

const mkid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
let rid = null;
try{ rid = localStorage.getItem('signal-rid'); }catch(_){}
if(!rid){ rid = mkid(); try{ localStorage.setItem('signal-rid', rid); }catch(_){} }

let dbNs = null;
const dbInit = (async()=>{
  try{
    if(!window.claude || typeof claude.use !== 'function') return false;
    dbNs = await claude.use('db');
    return !!dbNs;
  }catch(_){ return false; }
})();

let fb = null; // state for the issue currently shown

function bindFeedback(){
  const issue = ISSUES[cur];
  const state = { issue: issue.no, answers:{}, name:'', lead:'', submitted:false, submittedAt:'' };
  fb = state;
  const askEls = Array.prototype.slice.call(document.querySelectorAll('.ask:not(.partner)'));
  const nameInput = $('#fbname'), leadBox = $('#leadbox'), submitBtn = $('#submitall'), submitSt = $('#submitstatus'), submitNote = $('#submitnote');
  let docRef = null, timer = null;

  const setStatus=(msg,err)=>{ submitSt.textContent=msg||''; submitSt.hidden=!msg; submitSt.classList.toggle('err',!!err); };
  const setNote=(msg,dirty)=>{ submitNote.textContent=msg; submitNote.classList.toggle('dirty',!!dirty); };
  const NOTE_IDLE='Press Submit when you are done.';
  const NOTE_DIRTY='Draft saved, not submitted yet. Press Submit when you are done.';
  const NOTE_DONE='Submitted. You can change your answers and submit again any time.';

  function slot(qi){ const k='q'+(qi+1); if(!state.answers[k]) state.answers[k]={question:issue.asks[qi]?issue.asks[qi].q:'',answer:'',comment:''}; return state.answers[k]; }
  function collect(){
    askEls.forEach((ask,qi)=>{ const picked=ask.querySelector('.opt.on'); const box=ask.querySelector('.qc'); const s=slot(qi);
      s.answer=picked?picked.textContent.trim():''; s.comment=box?(box.value||'').trim():''; });
    state.name=(nameInput.value||'').trim(); state.lead=(leadBox.value||'').trim();
  }
  function hasContent(){ return !!(state.name||state.lead||Object.keys(state.answers).some(k=>state.answers[k].answer||state.answers[k].comment)); }
  function hydrate(d){
    state.answers=(d.answers&&typeof d.answers==='object')?JSON.parse(JSON.stringify(d.answers)):{};
    state.name=d.name||''; state.lead=d.lead||'';
    askEls.forEach((ask,qi)=>{ const rec=state.answers['q'+(qi+1)]; if(!rec) return;
      if(rec.answer&&!ask.querySelector('.opt.on')) Array.prototype.forEach.call(ask.querySelectorAll('.opt'),b=>{ if(b.textContent.trim()===rec.answer) b.classList.add('on'); });
      const box=ask.querySelector('.qc'); if(box&&!box.value.trim()&&rec.comment) box.value=rec.comment; });
    if(!nameInput.value.trim()&&state.name) nameInput.value=state.name;
    if(!leadBox.value.trim()&&state.lead) leadBox.value=state.lead;
    state.submitted=!!d.submitted; state.submittedAt=d.submittedAt||'';
    if(state.submitted) submitBtn.textContent='Update my response';
    setNote(state.submitted?NOTE_DONE:(hasContent()?NOTE_DIRTY:NOTE_IDLE), !state.submitted&&hasContent());
  }
  (async()=>{
    if(!await dbInit || fb!==state) return;
    try{ docRef=dbNs.doc('responses/issue'+issue.no+'/readers/'+rid); const snap=await docRef.get(); if(fb===state && snap.exists) hydrate(snap.data()||{}); }catch(_){ docRef=null; }
  })();

  async function save(){
    if(!docRef) return false;
    const body={ issue:issue.no, answers:state.answers, name:state.name.slice(0,200), lead:state.lead.slice(0,4000), submitted:!!state.submitted, submittedAt:state.submittedAt||'', updatedAt:new Date().toISOString() };
    for(let attempt=0;attempt<2;attempt++){
      try{ await docRef.set(body); return true; }
      catch(err){ if(err&&err.code==='unavailable'&&attempt===0){ await new Promise(r=>setTimeout(r,500)); continue; } return false; }
    }
    return false;
  }
  function mailtoBody(){
    const lines=['The Signal No. '+issue.no+' feedback','', 'Name: '+(state.name||'(not given)'),''];
    Object.keys(state.answers).forEach(k=>{ const a=state.answers[k]; if(!a.answer&&!a.comment) return; lines.push(a.question); if(a.answer) lines.push('  Picked: '+a.answer); if(a.comment) lines.push('  Comment: '+a.comment); lines.push(''); });
    if(state.lead){ lines.push('Accounts or clients to pursue together:'); lines.push('  '+state.lead); }
    return lines.join('\n');
  }
  function queueDraft(){ clearTimeout(timer); timer=setTimeout(async()=>{ collect(); if(!hasContent()) return; if(!await dbInit||!docRef) return; if(await save()&&!state.submitted) setNote(NOTE_DIRTY,true); },1200); }
  function touched(){ setStatus(''); if(!state.submitted) setNote(NOTE_DIRTY,true); queueDraft(); }

  const root=$('#feedback');
  root.addEventListener('click', e=>{ const o=e.target.closest('.opt'); if(!o) return; o.closest('.ask').querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); o.classList.add('on'); touched(); });
  Array.prototype.forEach.call(root.querySelectorAll('.fld'), el=>el.addEventListener('input',touched));
  nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') e.preventDefault(); });

  submitBtn.addEventListener('click', async()=>{
    clearTimeout(timer); collect();
    if(!hasContent()){ setStatus('Pick an option or write something before submitting.',true); return; }
    submitBtn.disabled=true; setStatus('Submitting…');
    const online = await dbInit;
    if(online && docRef){
      state.submitted=true; state.submittedAt=new Date().toISOString();
      const ok=await save(); submitBtn.disabled=false;
      if(ok){ submitBtn.textContent='Update my response'; setNote(NOTE_DONE,false);
        setStatus(state.name?'Thanks. We have your feedback and the Catalant team may follow up with you.':'Thanks. We have your feedback and will use it to shape the next issue.'); return; }
      state.submitted=false; state.submittedAt='';
    }
    const sent = await postToForm(state);
    submitBtn.disabled=false;
    if(sent){
      /* Resubmitting appends another row rather than updating one, so clear
         the form instead of leaving answers sitting there inviting duplicates. */
      const named = !!state.name;
      askEls.forEach(function(ask){
        Array.prototype.forEach.call(ask.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
        const box = ask.querySelector('.qc'); if(box) box.value = '';
      });
      nameInput.value=''; leadBox.value='';
      state.answers={}; state.name=''; state.lead='';
      setStatus('');
      setNote(named
        ? 'Thanks. We have your feedback and the Catalant team may follow up with you.'
        : 'Thanks. We have your feedback and will use it to shape the next issue.', false);
      return;
    }
    const href='mailto:'+EMAIL+'?subject='+encodeURIComponent('The Signal No. '+issue.no+' feedback')+'&body='+encodeURIComponent(mailtoBody());
    window.location.href=href;
    setStatus('We could not send that directly, so your email app is opening with your answers ready.');
    setNote(NOTE_IDLE,false);
  });
}

/* start on the issue in the URL hash if there is one, else the current issue */
(function(){
  const m=(location.hash||'').match(/issue-(\d+)/);
  let i=0; if(m){ const k=ISSUES.findIndex(s=>String(s.no)===m[1]); if(k>=0) i=k; }
  show(i);
})();
</script>
</body></html>
